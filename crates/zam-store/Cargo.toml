[package]
name = "zam-store"
description = "Хранилище ZeroAIMemory: SQLite (писатель, читатели, миграции)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rusqlite.workspace = true
thiserror.workspace = true
fs4.workspace = true
zam-core = { path = "../zam-core", features = ["sqlite"] }
tokio = { workspace = true, features = ["fs", "io-util"] }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
base64.workspace = true
sha2.workspace = true
blake3.workspace = true
unicode-normalization.workspace = true
regex.workspace = true
globset.workspace = true
similar.workspace = true
zam-markdown = { path = "../zam-markdown" }
# карта кода (M5.6): типы протокола, `split_ref`, `fts_terms`, входы ранжирования; без фич —
# C-код tree-sitter в хранилище и сервер не попадает
zam-code = { path = "../zam-code" }
# типы извлечения документов (`Extracted`, `Unit`, `Locator`, `DocKind`) для кэша `blob_extract` и
# чанков вложений (M5); без фичи `pdfium` крейт — чистый Rust (quick-xml, zip, encoding_rs)
zam-docs = { path = "../zam-docs" }
# id чанков вложений — UUIDv5 (M5, задача 4)
uuid.workspace = true
# кэш извлечения вложений: `units` — zstd(JSON) (M5 §3)
zstd.workspace = true
half.workspace = true
tracing.workspace = true
# импорт пространства (M6 §12б.5): разбор и проверка архива (крейт workspace, уже у zam-docs)
zip.workspace = true

[features]
# Точка остановки фоновой перенарезки при открытии базы — только для тестов (включает
# dev-зависимость zam-server); в сборке сервера и релизе её нет.
test-hooks = []

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rusqlite.workspace = true
# свойства разбора `data` идеи (M5.7, `idea_patch_never_panics`)
proptest.workspace = true

# замороженные часы — отдельный процесс: при `cargo test --workspace` фича объединяется, и
# заморозка в юнит-тестах шла бы параллельно с тестами, читающими часы (M6, ревью задачи 6)
[[test]]
name = "freeze"
required-features = ["test-hooks"]
