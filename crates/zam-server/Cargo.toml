[package]
name = "zam-server"
description = "Сервер ZeroAIMemory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "zam_server"
path = "src/lib.rs"

[[bin]]
name = "zam-server"
path = "src/main.rs"

[dependencies]
zam-core = { path = "../zam-core" }
serde.workspace = true
toml.workspace = true
ipnet.workspace = true
thiserror.workspace = true
argon2.workspace = true
zam-store = { path = "../zam-store" }
zam-index = { path = "../zam-index" }
zam-ml = { path = "../zam-ml" }
zam-fetch = { path = "../zam-fetch" }
zam-search = { path = "../zam-search" }
jiff.workspace = true
serde_json.workspace = true
# ETag кэша триггеров (§10.3)
blake3.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = { workspace = true, features = ["multipart"] }
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap.workspace = true
rpassword.workspace = true
anyhow.workspace = true
subtle.workspace = true
cookie.workspace = true
memory-serve.workspace = true
zam-markdown = { path = "../zam-markdown" }
lru.workspace = true
uuid.workspace = true
sha2.workspace = true
mime_guess.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tower = { workspace = true, features = ["util"] }
# Vault (§7.6): шифрование, мастер-ключ в base64, случайность ОС
chacha20poly1305.workspace = true
zeroize.workspace = true
base64.workspace = true
rand.workspace = true

# Vault: DACL файла мастер-ключа (только владелец, SYSTEM, администраторы)
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
memory-serve.workspace = true

[dev-dependencies]
# точка остановки воркера перед записью пачки (tests/qdrant_lifecycle.rs)
zam-index = { path = "../zam-index", features = ["test-hooks"] }
zip.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
