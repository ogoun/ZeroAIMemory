[package]
name = "zam-server"
description = "Сервер ZeroAIMemory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "zam_server"
path = "src/lib.rs"

[[bin]]
name = "zam-server"
path = "src/main.rs"

[dependencies]
zam-core = { path = "../zam-core" }
serde.workspace = true
toml.workspace = true
ipnet.workspace = true
thiserror.workspace = true
argon2.workspace = true
zam-store = { path = "../zam-store" }
# M5.6: карта кода — протокол, ранжирование и упаковка карты (без фичи `parse`: C-код
# грамматик tree-sitter сервер не тянет)
zam-code = { path = "../zam-code" }
zam-index = { path = "../zam-index" }
zam-ml = { path = "../zam-ml" }
zam-fetch = { path = "../zam-fetch" }
zam-search = { path = "../zam-search" }
# M5: извлечение документов; PDF (pdfium) и миниатюры изображений — только в рабочем процессе
# `doc-worker`
zam-docs = { path = "../zam-docs", features = ["pdfium", "images"] }
jiff.workspace = true
# `raw_value`: файлы `PUT /code/files` разбираются по одному без промежуточного `Value`
serde_json = { workspace = true, features = ["raw_value"] }
# ETag кэша триггеров (§10.3)
blake3.workspace = true
# ключ имён архива экспорта без учёта регистра и формы Unicode (NFC; MIT OR Apache-2.0, уже у zam-store)
unicode-normalization.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = { workspace = true, features = ["multipart"] }
tower-http = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap.workspace = true
rpassword.workspace = true
anyhow.workspace = true
subtle.workspace = true
cookie.workspace = true
memory-serve.workspace = true
zam-markdown = { path = "../zam-markdown" }
lru.workspace = true
uuid.workspace = true
sha2.workspace = true
mime_guess.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
# `LengthLimitError` чтения тела `POST /code/sync` (413 против 400); уже в дереве через axum
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
# Vault (§7.6): шифрование, мастер-ключ в base64, случайность ОС
chacha20poly1305.workspace = true
zeroize.workspace = true
base64.workspace = true
rand.workspace = true
# MCP `/mcp` (§13.1): streamable HTTP поверх REST-ядра
rmcp.workspace = true
# `zam-server backup --zip` и `restore` из архива (M6 §12б.2–§12б.3)
zip.workspace = true
# `backup`: VACUUM INTO, коды ошибок SQLite; свободное место тома
rusqlite.workspace = true
fs4.workspace = true

# Vault: DACL файла мастер-ключа (только владелец, SYSTEM, администраторы);
# служба: таймаут Preshutdown (ChangeServiceConfig2W / QueryServiceConfig2W)
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Services"] }
# служба Windows (SCM, §13.3): диспетчер, обработчик команд, регистрация
windows-service.workspace = true

# рабочий процесс документов: номер SIGKILL в разборе статуса выхода (docs/pool.rs)
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Тестовые точки (заглушка реранкера `RerankSlot::install`, точка остановки поиска после
# каналов `AppState::search_hold` на `zam_index::test_hooks::Hold`) — только интеграционным
# тестам пакета через dev-зависимость на себя; в сборке сервера и релизе их нет.
test-hooks = ["zam-index/test-hooks"]

[build-dependencies]
memory-serve.workspace = true

[dev-dependencies]
# точка остановки воркера перед записью пачки (tests/qdrant_lifecycle.rs)
zam-index = { path = "../zam-index", features = ["test-hooks"] }
# задержка фоновой перенарезки при открытии базы (tests/index_rechunk.rs, ход `rechunk`)
zam-store = { path = "../zam-store", features = ["test-hooks"] }
# тестовые точки самого сервера (tests/search_rerank_boosts.rs)
zam-server = { path = ".", features = ["test-hooks"] }
# PDF-фикстуры тестов рабочего процесса (tests/doc_worker.rs)
zam-docs = { path = "../zam-docs", features = ["pdfium", "test-pdf", "images"] }
tower = { workspace = true, features = ["util"] }
# изображения-фикстуры превью (tests/previews.rs)
image.workspace = true
# приёмка M5.7: база 0023 и объекты схемы прямым SQL (tests/m57_acceptance.rs)
rusqlite.workspace = true
