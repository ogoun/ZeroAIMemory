[package]
name = "zam-search"
description = "Гибридный поиск ZeroAIMemory: weighted RRF каналов Qdrant и FTS, поправки, упаковка в бюджет"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zam-core = { path = "../zam-core" }
jiff.workspace = true
# `error_regex` триггеров в `/recall` (§10.3): тот же диалект без обратных ссылок, что в zam-store
regex.workspace = true
# правило покрытия `recall.post_tool_coverage` в конфигурации сервера
serde.workspace = true
# карточки ответа `/search` в правиле подсказок к запросу (`recall::PromptGate::admits_card`):
# одно правило для сервера и модели калибровки xtask (M6.6, ревью задачи 2)
serde_json.workspace = true
# разбиения наборов `eval` (M7.3 §6.4 п. 2): `probe_split` и `split_by_rank` — blake3(соль ‖ id);
# крейт уже в workspace (zam-store, xtask; CC0-1.0 OR Apache-2.0)
blake3.workspace = true
