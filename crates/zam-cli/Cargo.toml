[package]
name = "zam-cli"
description = "Клиент ZeroAIMemory: команда zam"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zam"
path = "src/main.rs"

# Без tokio, tracing и SQLite: холодный старт ≤ 20 мс.
[dependencies]
zam-core = { path = "../zam-core" }
clap.workspace = true
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
zam-server = { path = "../zam-server" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
axum.workspace = true
assert_cmd.workspace = true
