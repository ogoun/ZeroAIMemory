[package]
name = "zam-cli"
description = "Клиент ZeroAIMemory: команда zam"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "zam"
path = "src/main.rs"

# Без tokio, tracing и SQLite: холодный старт ≤ 20 мс.
[dependencies]
zam-core = { path = "../zam-core" }
clap.workspace = true
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# скрытый ввод значения `zam vault set` с терминала (Apache-2.0, уже у zam-server)
rpassword.workspace = true
# хуки агента (§10.3): маски file_glob и regex command/error (как проверка триггеров сервера;
# globset — Unlicense OR MIT, regex — MIT OR Apache-2.0, оба уже в дереве)
globset.workspace = true
regex.workspace = true
# короткий хэш id сессии в именах файлов кэша (CC0-1.0 OR Apache-2.0, уже в дереве)
blake3.workspace = true
# карта кода (M5.6): экстрактор tree-sitter — фича `parse` только у клиента (сервер без C-кода)
zam-code = { path = "../zam-code", features = ["parse"] }

# цепочка предков процесса (привязка `zam mcp` к сессии, M6 §7.1): ToolHelp32 (MIT OR
# Apache-2.0, крейт workspace, уже у xtask)
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[features]
# точки подмены для тестов (цепочка предков процесса `hook::procs`; задержка записи привязки
# `ZAM_TEST_BINDING_STALL_MS` — бюджет хука, M6 задача 5; она же есть в отладочной сборке —
# бинарник интеграционных тестов)
test-hooks = []

[dev-dependencies]
zam-server = { path = "../zam-server" }
zam-store = { path = "../zam-store" }
# тесты: разбор frontmatter `refs:` тем же парсером, что у сервера (zam write --ref)
zam-markdown = { path = "../zam-markdown" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
axum.workspace = true
assert_cmd.workspace = true
# приёмка M5.6: причина устарелости ссылки — из базы сервера соединением только для чтения
rusqlite.workspace = true
