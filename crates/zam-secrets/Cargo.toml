[package]
name = "zam-secrets"
description = "Сканер и маскировщик секретов ZeroAIMemory (ТЗ §7.6): ключи, токены, пароли, закрытые ключи"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Лёгкий крейт без tokio и comrak: его берут `zam-markdown` (реэкспорт `zam_markdown::secrets`)
# и клиент `zam` (маскировка снимка сессии, задача 17a M6)
[dependencies]
regex.workspace = true
# покрытие значений секретов в итоге записи агентом (модуль `restore`, M7 §4.3.2 п. 5): поиск
# многих образцов одним проходом; только с фичей `restore`, клиенту `zam` не нужен
aho-corasick = { workspace = true, optional = true }

[features]
# `zam_secrets::restore` — обратный путь маски для записи агентом (сервер): нумерованный вид
# `‹secret-N›`, восстановление по номеру метки и проверка покрытия (M7 §4.3.2, круги правок 3–4
# задачи 6 M7.1); клиенту `zam` не нужен
restore = ["dep:aho-corasick"]

[dev-dependencies]
proptest.workspace = true
# эталон CommonMark для сверки участков кода (`tests/commonmark.rs`, круг правок 5 задачи 5
# M7.1): только для тестов — в обычную сборку клиента `zam` не попадает
comrak.workspace = true
# `Id` в тесте ложных срабатываний на base32-идентификаторах
zam-core = { path = "../zam-core" }
