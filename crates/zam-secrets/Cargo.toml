[package]
name = "zam-secrets"
description = "Сканер и маскировщик секретов ZeroAIMemory (ТЗ §7.6): ключи, токены, пароли, закрытые ключи"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Лёгкий крейт без tokio и comrak: его берут `zam-markdown` (реэкспорт `zam_markdown::secrets`)
# и клиент `zam` (маскировка снимка сессии, задача 17a M6)
[dependencies]
regex.workspace = true
# восстановление значений под `‹secret›` при записи агентом (`restore`, M7 §4.3.2, круг правок 1
# задачи 6 M7.1): дифф строк и слов; без зависимостей, уже в дереве (`zam-store`)
similar.workspace = true

[dev-dependencies]
proptest.workspace = true
# эталон CommonMark для сверки участков кода (`tests/commonmark.rs`, круг правок 5 задачи 5
# M7.1): только для тестов — в обычную сборку клиента `zam` не попадает
comrak.workspace = true
# `Id` в тесте ложных срабатываний на base32-идентификаторах
zam-core = { path = "../zam-core" }
