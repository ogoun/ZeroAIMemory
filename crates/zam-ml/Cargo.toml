[package]
name = "zam-ml"
description = "ML ZeroAIMemory: ONNX Runtime (load-dynamic), выбор устройства, токенизатор, эмбеддер bge-m3, реранкер"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ort.workspace = true
tokenizers.workspace = true
half.workspace = true
zip.workspace = true
lru.workspace = true
serde.workspace = true
toml.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
zam-markdown = { path = "../zam-markdown" }

# номер файла и том для ключа кэша sha8 (как в zam-index: тот же крейт и версия)
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json.workspace = true
