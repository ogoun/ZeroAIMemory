[package]
name = "zam-markdown"
description = "Markdown ZeroAIMemory: разбор (позиции, секции, ссылки) и HTML-рендер (comrak, syntect, ammonia)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ammonia.workspace = true
comrak.workspace = true
mime_guess.workspace = true
# сила границы при нарезке (`chunk_cohesion`): основы слов Snowball ru/en, задача 17 M3
rust-stemmers.workspace = true
serde.workspace = true
syntect.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
# сканер секретов §7.6 (реэкспорт `zam_markdown::secrets` и прежние имена), задача 15b M6
zam-secrets = { path = "../zam-secrets" }
# стоп-список ru/en (`zam_core::text`, общий с совпадением слов подсказок `zam-search`)
zam-core = { path = "../zam-core" }

[dev-dependencies]
serde_json.workspace = true
proptest.workspace = true
pulldown-cmark.workspace = true
