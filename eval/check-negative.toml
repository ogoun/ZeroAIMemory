# Посторонние вопросы ночной проверки памяти (спецификация M7 §6.4 п. 4): 30 вопросов ru/en вне
# тем памяти агента — быт, спорт, география. Они идут подсказкой к запросу (`/recall` `prompt`) в
# области каждого решения пользователя; доля запросов, к которым память показала хоть одну
# подсказку, — метрика `negatives_shown` (подсказки не по делу).
#
# Набор встроен в сервер (`include_str!`, `crates/zam-server/src/check/negatives.rs`) и общий для
# всех пользователей. Смена набора делает числа несопоставимыми: вместе с правкой файла поднимите
# `CHECK_VERSION` и `NEGATIVES_HASH` (тест `negatives_hash_pinned` напомнит).

