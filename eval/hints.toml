# Набор точности подсказок хуков eval M4 (ТЗ §10.3, §18.2; задача 15 M4). Формат и правила —
# eval/README.md, раздел «Подсказки хуков».
#
# Прогон `cargo xtask eval --hints` поднимает сервер с корпусом eval/corpus и insight
# eval/insights.toml, добавляет записи этого файла (`[[insight]]` — с триггерами, `[[rule]]` —
# заметки Rules) и проверяет случаи `[[case]]`:
# - `prompt` — `POST /recall {event: prompt}` (поиск по insight и Rules, балл ≥
#   `recall.prompt_min_score`, до 3 подсказок);
# - `post_tool` — `POST /recall {event: post_tool, tool: "Bash"}` (`error_regex`, затем FTS по
#   insight с порогом покрытия слов ошибки);
# - `pre_tool` — процесс `zam hook pre-tool` (только локально: `file_glob` по пути файла
#   `Write`/`Edit`, `command_regex` по команде `Bash`; кэш триггеров — от `zam hook session-start`).
#
# `expected` — подсказки, которые должны быть показаны (`insight:<key>` — запись eval/insights.toml
# или этого файла, `rule:<key>` — заметка Rules этого файла); пусто — ожидается тишина.
# Релевантными считаются и обе записи пары «надёжное — гипотеза» одной темы: подсказка показывает
# `certainty`, агент видит, какой записи верить.
#
# Записи этого файла в прогоны поиска (`cargo xtask eval --mode …`) не входят: отпечаток корпуса
# M3 не меняется.

# ======================= insight с триггерами (pre_tool, post_tool) =======================

[[insight]]
key = "h01-sh-lf"
lang = "ru"
kind = "gotcha"
scope = "solution"
title = "Bash-скрипты в репозитории хранятся с LF"
body = "Скрипт .sh с переводами строк CRLF падает в Linux и Git Bash с ошибкой «$'\\r': command not found». В .gitattributes для *.sh задано eol=lf; редактор на Windows должен сохранять такие файлы с LF."
triggers = [{ type = "file_glob", pattern = "**/*.sh", tools = ["Write", "Edit"] }]

[[insight]]
key = "h02-ps1-bom"
lang = "ru"
kind = "gotcha"
scope = "solution"
title = "Скрипты PowerShell с кириллицей сохраняются в UTF-8 с BOM"
body = "Windows PowerShell 5.1 читает .ps1 без BOM в кодировке ANSI, и кириллица в строках превращается в мусор. Скрипты PowerShell проекта сохраняются в UTF-8 с BOM."
triggers = [{ type = "file_glob", pattern = "**/*.ps1", tools = ["Write", "Edit"] }]

[[insight]]
key = "h03-migrations"
lang = "ru"
kind = "decision"
scope = "solution"
certainty = "axiom"
title = "Выпущенные миграции SQLite не правятся — только новая миграция"
body = "Миграция, попавшая в релиз, уже применена у пользователей: её правка расходится с их базами. Изменение схемы — новый файл миграции со следующим номером и копия базы перед применением."
triggers = [{ type = "file_glob", pattern = "crates/zam-store/migrations/**", tools = ["Write", "Edit"] }]

[[insight]]
key = "h04-gha-secrets"
lang = "en"
kind = "gotcha"
scope = "solution"
title = "Workflows must not expose secrets to pull_request_target jobs"
body = "A pull_request_target workflow runs with repository secrets on code from a fork. Check out the pull request head only in jobs without secrets and keep the default read-only token permissions."
triggers = [{ type = "file_glob", pattern = ".github/workflows/*.yml", tools = ["Write", "Edit"] }]

[[insight]]
key = "h05-force-push"
lang = "en"
kind = "decision"
scope = "solution"
certainty = "axiom"
title = "Never force-push shared branches"
body = "Force-pushing rewrites history other machines already have. Undo published commits with git revert; rebase only local branches that nobody else pulled."
triggers = [{ type = "command_regex", pattern = "git\\s+push\\b.*(--force\\b|--force-with-lease|\\s-f\\b)" }]

[[insight]]
key = "h06-git-clean"
lang = "ru"
kind = "gotcha"
scope = "solution"
title = "git clean -x удаляет .env и локальные конфиги"
body = "Флаг -x у git clean удаляет и игнорируемые файлы: .env, локальные конфиги, кэш моделей в target. Сначала git clean -n, затем точечное удаление."
triggers = [{ type = "command_regex", pattern = "git\\s+clean\\s+-[a-wyz]*x" }]

[[insight]]
key = "h07-no-docker"
lang = "ru"
kind = "decision"
scope = "solution"
certainty = "axiom"
title = "Docker в проекте не используется для запуска зависимостей"
body = "Qdrant, ONNX Runtime и модели ставятся нативными бинарниками из манифестов deploy/ (cargo xtask fetch-deps); контейнеры для разработки и тестов не нужны."
triggers = [{ type = "command_regex", pattern = "\\bdocker\\b" }]

[[insight]]
key = "h08-lnk1181"
lang = "ru"
kind = "failure"
scope = "solution"
title = "LNK1181: компоновщик не находит onnxruntime.lib"
body = "Сборка с динамической загрузкой ONNX Runtime не должна линковаться с onnxruntime.lib. Ошибка LNK1181 значит, что включена фича статической линковки ort; нужна фича load-dynamic и путь ml.ort_dylib."
triggers = [{ type = "error_regex", pattern = "LNK1181", tools = ["Bash"] }]

[[insight]]
key = "h09-sqlite-busy"
lang = "en"
kind = "failure"
scope = "global"
title = "database is locked (SQLITE_BUSY): a second writer without busy_timeout"
body = "SQLITE_BUSY with the message database is locked means another connection holds the write lock. Route all writes through one writer and set busy_timeout on every connection."
triggers = [{ type = "error_regex", pattern = "database is locked|SQLITE_BUSY" }]

[[insight]]
key = "h10-port-in-use"
lang = "en"
kind = "failure"
scope = "solution"
title = "Address already in use: an old server instance still holds the port"
body = "os error 10048 on Windows and EADDRINUSE on Linux mean the port is taken, usually by a previous zam-server or its Qdrant. Stop the old process or pick a free port."
triggers = [{ type = "error_regex", pattern = "os error 10048|Address already in use|EADDRINUSE" }]

[[insight]]
key = "h11-crlf-bash"
lang = "ru"
kind = "failure"
scope = "solution"
title = "Ошибка $'\\r': command not found — скрипт сохранён с CRLF"
body = "Bash видит символ возврата каретки в конце каждой строки скрипта с переводами CRLF. Перевести файл в LF (dos2unix или настройка редактора) и закрепить eol=lf в .gitattributes."
triggers = [{ type = "error_regex", pattern = "\\$'\\\\r': command not found" }]

# ---- без триггеров: подсказку post_tool даёт FTS по нормализованной ошибке ----

[[insight]]
key = "h12-npm-eresolve"
lang = "en"
kind = "failure"
scope = "solution"
title = "npm ERESOLVE unable to resolve dependency tree after a peer upgrade"
body = "npm ERR! code ERESOLVE appears when a peer dependency range no longer matches. Upgrade the plugin together with its peer instead of passing --legacy-peer-deps."

[[insight]]
key = "h13-cuda-dll"
lang = "en"
kind = "failure"
scope = "solution"
title = "LoadLibrary failed with error 126 for onnxruntime_providers_cuda.dll"
body = "Error 126 when loading onnxruntime_providers_cuda.dll means a dependent NVIDIA library such as cudnn or cublas is missing next to it. Run zam-server cuda fetch instead of installing the CUDA Toolkit."

[[insight]]
key = "h14-exec-policy"
lang = "en"
kind = "gotcha"
scope = "global"
title = "Running scripts is disabled on this system: PowerShell execution policy"
body = "The script cannot be loaded because running scripts is disabled on this system. Set the execution policy to RemoteSigned for the current user once."

[[insight]]
key = "h15-git-nonff"
lang = "en"
kind = "gotcha"
scope = "solution"
title = "Push rejected as non-fast-forward: pull with rebase first"
body = "The remote has commits you do not have: failed to push some refs, rejected, non-fast-forward. Run git pull --rebase and push again instead of forcing."

[[insight]]
key = "h16-cargo-lock"
lang = "en"
kind = "gotcha"
scope = "global"
title = "Blocking waiting for file lock on build directory"
body = "Another cargo process, often the editor's language server, holds the lock on the target build directory. Wait for it or give the second build its own CARGO_TARGET_DIR."

[[insight]]
key = "h17-lnk1104"
lang = "en"
kind = "failure"
scope = "solution"
title = "LNK1104 cannot open file in target: antivirus holds freshly built files"
body = "fatal error LNK1104: cannot open file under target\\debug appears when real-time antivirus scanning locks the file the linker just wrote. Exclude the target directory and the cargo cache from scanning."

# ---- M6 §9 (задача 9): классы ошибок — сборка, тесты, git, кодировки, сеть; без триггеров ----

[[insight]]
key = "h18-py-charmap"
lang = "en"
kind = "failure"
scope = "global"
title = "UnicodeDecodeError: 'charmap' codec can't decode byte when Python reads a file on Windows"
body = "Python on Windows opens text files in the ANSI code page by default, so UTF-8 input fails with a charmap codec error. Pass encoding='utf-8' to open() or set PYTHONUTF8=1 for the process."

[[insight]]
key = "h19-git-autocrlf"
lang = "en"
kind = "gotcha"
scope = "solution"
title = "warning: LF will be replaced by CRLF — core.autocrlf rewrites line endings"
body = "With core.autocrlf=true Git converts line endings on checkout and commit, and scripts break. The repository pins eol in .gitattributes; set core.autocrlf=false for this clone."

[[insight]]
key = "h20-git-index-lock"
lang = "en"
kind = "failure"
scope = "global"
title = "Unable to create index.lock: File exists — another git process holds the lock"
body = "A crashed git command or the editor's git integration left .git/index.lock behind. Make sure no git process is running, then delete the stale index.lock file."

[[insight]]
key = "h21-proxy-ca"
lang = "en"
kind = "gotcha"
scope = "global"
title = "SSL certificate problem: unable to get local issuer certificate behind the corporate proxy"
body = "The corporate proxy re-signs TLS traffic with its own root certificate. Add the proxy root CA to the system store and point CARGO_HTTP_CAINFO or the npm cafile at it; never disable certificate verification."

[[insight]]
key = "h22-cargo-net-retry"
lang = "en"
kind = "gotcha"
scope = "global"
title = "Cargo fetch times out: spurious network error on the crates.io index"
body = "Over a slow proxy the sparse index download times out even though cargo retries spurious network errors. Set CARGO_NET_RETRY=10 and CARGO_HTTP_TIMEOUT=120 instead of switching to the git index."

[[insight]]
key = "h23-test-conn-refused"
lang = "en"
kind = "failure"
scope = "solution"
title = "Integration tests fail with connection refused when the test server is not ready yet"
body = "Tests that connect right after spawning the server get connection refused (os error 10061 on Windows, ECONNREFUSED on Linux). Wait for the health endpoint instead of a fixed sleep."

[[insight]]
key = "h24-tests-shared-dir"
lang = "ru"
kind = "failure"
scope = "solution"
title = "Тесты с общим каталогом данных падают при параллельном запуске"
body = "Тесты, которые пишут в один и тот же каталог, мешают друг другу: «Отказано в доступе» и «процесс не может получить доступ к файлу, так как этот файл занят другим процессом». Каждому тесту — свой каталог в target, а не --test-threads=1."

[[insight]]
key = "h25-msvc-linker"
lang = "en"
kind = "failure"
scope = "global"
title = "linker link.exe not found: the MSVC build tools are missing"
body = "error: linker `link.exe` not found means the Visual Studio Build Tools with the C++ workload are not installed or the developer environment is not loaded. Install the workload, then rerun cargo build."

[[insight]]
key = "h26-console-cp866"
lang = "ru"
kind = "gotcha"
scope = "global"
title = "Вывод консоли Windows с кириллицей превращается в кракозябры"
body = "Кодовая страница консоли 866 не совпадает с UTF-8 вывода программы. Перед запуском — chcp 65001 и [Console]::OutputEncoding = [Text.Encoding]::UTF8."

# ======================= заметки Rules (prompt, дайджест session_start) =======================

[[rule]]
key = "commits"
path = "commits"
text = """
# Коммиты

Сообщения коммитов — Conventional Commits на русском: `feat(scope): что сделано`. В конце —
трейлер Co-Authored-By исполнителя. Коммит содержит только свои пути, без посторонних файлов.
"""

[[rule]]
key = "tmp-files"
path = "temporary-files"
text = """
# Временные файлы

Временные файлы, логи прогонов и снимки — только в каталоге .tmp/ проекта или в target/.
Системный temp, /tmp и %TEMP% не используются.
"""

[[rule]]
key = "deps"
path = "dependencies"
text = """
# Dependencies

A new crate or npm package is added only after a license audit (MIT, Apache-2.0 or compatible)
and a note in the task journal. Prefer crates already in the workspace.
"""

