# Eval M4.5: словарь домена RU↔EN (задача 15, спецификация §2.2, §13).
#
# [[term]] — термин словаря: key (идентификатор набора, `term:<key>` в выдаче), title —
# каноническое имя (так слово пишется в заметках корпуса), definition (≤ 300 символов),
# aliases — псевдонимы: русский сленг и транслитерация, сокращения, английские слова.
# Термины создаются в пространстве решения набора (`POST /spaces/{решение}/entries`,
# `kind: term`).
#
# [[query]] — запрос на псевдониме: text содержит псевдоним термина `term` и не содержит его
# имени; expect — заметки корпуса, где встречается каноническое имя (начало слова, без учёта
# регистра) и нет псевдонима запроса — найти их по этому слову может только канал `alias`
# (или векторный канал по смыслу). Проверка — `cargo xtask eval --check`, тест
# `glossary_set_is_valid`.

[[term]]
key = "kubernetes"
title = "Kubernetes"
definition = "Оркестратор контейнеров: кластер из control plane и узлов, на которых запускаются поды."
aliases = ["k8s", "кубер", "кубернетес"]

[[term]]
key = "redis"
title = "Redis"
definition = "Хранилище ключ–значение в памяти: кэш, очереди, кластер с шардированием по слотам."
aliases = ["редис"]

[[term]]
key = "postgres"
title = "Postgres"
definition = "PostgreSQL — реляционная СУБД проекта и сервисов: миграции схемы, обновления версий, индексы."
aliases = ["постгрес", "постгре"]

[[term]]
key = "docker"
title = "Docker"
definition = "Контейнерная среда: образы, сборка из Dockerfile, контейнеры, тома."
aliases = ["докер"]

[[term]]
key = "nginx"
title = "nginx"
definition = "Веб-сервер и обратный прокси: TLS, заголовки X-Forwarded-*, тайм-ауты upstream."
aliases = ["энджинкс", "нджинкс"]

[[term]]
key = "qdrant"
title = "Qdrant"
definition = "Векторная база ZeroAIMemory: сервер запускает её как управляемый процесс."
aliases = ["кудрант", "кдрант"]

[[term]]
key = "sqlite"
title = "SQLite"
definition = "Встраиваемая СУБД в одном файле: WAL, busy_timeout, FTS5, VACUUM."
aliases = ["скулайт"]

[[term]]
key = "powershell"
title = "PowerShell"
definition = "Оболочка Windows: конвейер объектов, кодировка вывода, политика выполнения."
aliases = ["pwsh", "повершелл", "пауэршелл"]

[[term]]
key = "rebase"
title = "rebase"
definition = "Перенос коммитов ветки на новую базу в git с переписыванием истории."
aliases = ["ребейз", "перебазирование"]

[[term]]
key = "robocopy"
title = "robocopy"
definition = "Утилита Windows для копирования и зеркалирования каталогов с повторами."
aliases = ["робокопи"]

[[term]]
key = "cron"
title = "cron"
definition = "Планировщик заданий Unix: crontab, расписание из пяти полей, урезанное окружение."
aliases = ["крон"]

[[term]]
key = "playwright"
title = "Playwright"
definition = "Фреймворк end-to-end тестов в браузере: ожидания, повторы, трассы."
aliases = ["плейрайт"]

[[term]]
key = "webhook"
title = "webhook"
definition = "HTTP-обратный вызов: внешняя система присылает событие на адрес сервиса."
aliases = ["вебхук"]

[[term]]
key = "deadlock"
title = "взаимоблокировка"
definition = "Потоки ждут блокировки друг друга по кругу и не продвигаются."
aliases = ["дедлок"]

[[term]]
key = "quantization"
title = "квантование"
definition = "Перевод весов и активаций модели в низкую разрядность (int8) ради скорости и размера."
aliases = ["квантизация", "quantization"]

[[term]]
key = "timeout"
title = "таймаут"
definition = "Предельное время ожидания операции, после которого она прерывается с ошибкой."
aliases = ["timeout", "тайм-аут"]

