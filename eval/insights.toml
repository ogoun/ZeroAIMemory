# ---- k02: повторы, frontend (заметка en/web/fetch-retry-abort) ----

[[insight]]
key = "k02-t"
lang = "en"
kind = "gotcha"
scope = "solution"
area = "frontend"
title = "Reusing an aborted AbortController makes every fetch retry fail instantly"
body = "The retry loop passed the same AbortController signal to each attempt. Once the timeout aborted the first attempt, the signal stayed aborted, so every retry rejected immediately with AbortError and the wrapper reported a timeout after 0 ms. Each attempt needs its own controller; the component-level signal is combined with AbortSignal.any."

[[insight]]
key = "k02-n"
lang = "en"
kind = "experiment"
scope = "solution"
area = "frontend"
title = "Three fetch attempts with jitter cut failed product page loads by half"
body = "A/B test of the fetch wrapper: retrying GET requests on network errors up to three times with randomized backoff (300 ms, 1 s) reduced failed product page loads from 1.4 % to 0.7 % on mobile networks; median load time did not change."

# ---- k03: кэш, backend (заметка en/api/product-cache-invalidation) ----

[[insight]]
key = "k03-t"
lang = "en"
kind = "failure"
scope = "solution"
area = "backend"
title = "Cache stampede: popular product keys expiring together overloaded Postgres"
body = "During the sale all hot product cards were written within the same minute with a 15-minute TTL, so they expired together. Hundreds of concurrent misses for the same keys went to the primary database, connection pool waits exceeded 5 s and the catalog returned 503 for four minutes. Fix: random TTL spread of plus or minus 20 % and a single-flight lock per key on miss."

[[insight]]
key = "k03-n"
lang = "en"
kind = "discovery"
scope = "solution"
area = "backend"
title = "Product cache hit ratio rose from 81 to 94 percent after keying cards by locale"
body = "Before the change one Redis key held the card for all locales and every translation update deleted it. With product:{id}:{locale} keys an update of one locale invalidates only its own key, and the hit ratio of the product cache grew from 81 % to 94 %."

