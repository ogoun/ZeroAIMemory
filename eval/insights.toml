# ---- c12: модель эмбеддингов по устройствам ----

[[insight]]
key = "c12-a"
lang = "en"
kind = "decision"
scope = "solution"
title = "Use bge-m3 int8 everywhere"
body = "The int8 quantized bge-m3 model is used on every device, including GPUs, so that vectors are identical everywhere."

[[insight]]
key = "c12-b"
lang = "en"
kind = "decision"
scope = "solution"
supersedes = "c12-a"
title = "bge-m3 fp16 on CUDA, int8 only on CPU"
body = "On CUDA the embedder runs bge-m3 fp16, which is faster on the GPU than the int8 model and matches fp32 more closely; the int8 model stays the CPU default. Switching devices changes the collection model and requires a full reindex."

