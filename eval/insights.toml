# ---- r02: причина DNS-аварии (отзыв) ----

[[insight]]
key = "r02-wrong"
lang = "en"
kind = "failure"
scope = "global"
title = "Internal DNS outage was caused by overloaded authoritative servers"
body = "The intermittent SERVFAIL responses came from the authoritative servers for internal zones, which could not keep up with query volume."
retract_reason = "Authoritative servers were healthy; resolvers exhausted their shared worker pool waiting on an unreachable forwarder."

[[insight]]
key = "r02-fix"
lang = "en"
kind = "failure"
scope = "global"
title = "DNS outage: a forwarded zone with an unreachable target exhausted the resolver worker pool"
body = "A new conditional forwarder pointed at servers reachable from only one region. Elsewhere, forwarded queries waited for the full timeout and filled the shared worker pool, blocking resolution of every zone. Per-forwarder concurrency limits and short timeouts contain it."

