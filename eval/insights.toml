key = "c02-a"
lang = "ru"
kind = "gotcha"
scope = "solution"
title = "Сборка Rust на Windows падает из-за длинных путей"
body = "Ошибки «os error 3» при сборке на Windows вызваны пределом длины пути в 260 символов. Нужно включить LongPathsEnabled в реестре и перезапустить терминал."

[[insight]]
key = "c02-b"
lang = "ru"
kind = "gotcha"
scope = "solution"
supersedes = "c02-a"
title = "Сборка Rust на Windows: виноват Defender, а не длина путей"
body = "Повторный разбор показал, что сборка падала, потому что антивирус Defender удерживал только что записанные файлы в каталоге target, и компоновщик не мог их открыть. Помогло исключение каталога target и кеша cargo из проверки в реальном времени; LongPathsEnabled ни на что не влиял."

# ---- c03: synchronous в SQLite WAL ----

[[insight]]
key = "c03-a"
lang = "en"
kind = "decision"
scope = "global"
title = "Run the index SQLite database with synchronous=FULL"
body = "The index database runs in WAL mode with synchronous=FULL so that no committed transaction can be lost on power failure."

[[insight]]
key = "c03-b"
lang = "en"
kind = "decision"
scope = "global"
supersedes = "c03-a"
title = "synchronous=NORMAL is enough for the WAL-mode index database"
body = "In WAL mode, synchronous=NORMAL keeps the database consistent after power loss; only the last transactions before the crash may be rolled back, and the index can be rebuilt from the source of truth anyway. On HDD, FULL tripled write latency because every commit waited for an fsync of the WAL file, so the setting was switched to NORMAL."

