# ---- c08: ключ кеша зависимостей CI ----

[[insight]]
key = "c08-a"
lang = "en"
kind = "pattern"
scope = "solution"
title = "CI dependency cache key includes the branch name"
body = "The dependency cache key is the branch name plus the lockfile hash, so that branches never share cache entries."

[[insight]]
key = "c08-b"
lang = "en"
kind = "pattern"
scope = "solution"
supersedes = "c08-a"
title = "CI dependency cache key is the lockfile hash, written only from main"
body = "Including the branch in the cache key made every new branch start cold. The key is now the lockfile hash with a prefix restore key, all branches read the shared cache, and only jobs on the main branch may write to it, so a branch cannot poison the cache."

