# Insight набора eval M3 (ТЗ §18.2, задача 16 M3). Формат и правила — eval/README.md.
#
# Загрузчик (`cargo xtask eval`) создаёт записи в порядке файла: `supersedes` — замещение
# записи, определённой выше (`POST /entries/{id}/supersede`), `retract_reason` — отзыв после
# создания всех записей. Все записи, в том числе `certainty = "axiom"`, пишет токен прогона
# (агент, M4 §7.5); `theorem` — с `evidence {checked, method, result}`.
# Без `certainty` запись агента получает `hypothesis`.
#
# Группы ключей: c — цепочки замещения, r — отзывы и верные выводы на их месте,
# p — пары противоречий «надёжное — гипотеза».

# ---- c01: TTL кеша тарифов доставки ----

[[insight]]
key = "c01-a"
lang = "ru"
kind = "decision"
scope = "solution"
title = "Кеш тарифов доставки живёт 10 минут"
body = "Тарифы доставки кешируются на 10 минут по ключу регион и тип доставки. Дольше держать нельзя: тарифы меняются при обновлении договоров со службами доставки."

[[insight]]
key = "c01-b"
lang = "ru"
kind = "decision"
scope = "solution"
supersedes = "c01-a"
title = "Кеш тарифов доставки живёт 60 минут и прогревается перед распродажей"
body = "Срок жизни кеша тарифов доставки увеличен до 60 минут: тарифы меняются раз в сутки, а при обновлении договора кеш сбрасывается событием. За 10 минут до старта распродажи задача прогрева заполняет все сочетания региона и типа доставки за последний месяц."

# ---- c02: сборка Rust на Windows ----

