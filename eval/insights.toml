# ---- c10: max.poll.records потребителя индекса (три шага) ----

[[insight]]
key = "c10-a"
lang = "en"
kind = "decision"
scope = "solution"
title = "Search indexer consumer uses max.poll.records 500"
body = "The search indexer Kafka consumer fetches batches of 500 records with the default five-minute max.poll.interval.ms; bigger batches make bulk writes to the search engine efficient."

[[insight]]
key = "c10-b"
lang = "en"
kind = "failure"
scope = "solution"
supersedes = "c10-a"
title = "Search indexer consumer reduced to max.poll.records 100"
body = "Heavy price-change events made a 500-record batch take longer than five minutes, the consumer missed its poll deadline and triggered cascading rebalances. As a stopgap, max.poll.records is 100 and max.poll.interval.ms is ten minutes."

[[insight]]
key = "c10-c"
lang = "en"
kind = "decision"
scope = "solution"
supersedes = "c10-b"
title = "Search indexer back to max.poll.records 500 after the category mapping fix"
body = "With category lookup replaced by a prebuilt map, the heaviest event takes 120 ms, so the batch size is back to 500 records. The ten-minute max.poll.interval.ms stays as a safety margin, and the group uses the cooperative sticky assignor."

