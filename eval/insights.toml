area = "frontend"
certainty = "theorem"
title = "useEffect cleanup runs before every re-run of the effect, not only on unmount"
body = "React calls the cleanup of an effect before running the effect again after a dependency change, and on unmount. In development StrictMode it also mounts, cleans up and mounts again once. A subscription without a cleanup therefore leaks one listener per dependency change."
evidence = { checked = "price subscription effect of the product page", method = "counted listeners after switching between five products with and without the cleanup", result = "without cleanup 5 listeners stayed active, with cleanup 1" }

# ---- p23: nginx после продления сертификата ----

[[insight]]
key = "p23-h"
lang = "ru"
kind = "gotcha"
scope = "solution"
area = "infra"
certainty = "hypothesis"
contradicts = ["p23-t"]
title = "После продления сертификата certbot nginx подхватывает новый файл сам"
body = "certbot renew заменяет файлы сертификата, а nginx читает их при каждом TLS-рукопожатии, поэтому после продления ничего делать не нужно."

[[insight]]
key = "p23-t"
lang = "ru"
kind = "gotcha"
scope = "solution"
area = "infra"
certainty = "theorem"
title = "nginx держит сертификат в памяти: после продления нужен reload"
body = "nginx читает сертификат и ключ при запуске и при reload, а не при каждом рукопожатии. Без reload после certbot renew клиенты получают старый сертификат до истечения его срока. Reload делает deploy-hook certbot: systemctl reload nginx."
evidence = { checked = "стенд с сертификатом, продлённым certbot renew --force-renewal", method = "openssl s_client -connect до и после systemctl reload nginx, сравнение notAfter", result = "до reload — прежний notAfter, после — новый" }
