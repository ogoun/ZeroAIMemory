area = "backend"
title = "A 5 s statement timeout cut p99 latency of the orders endpoint"
body = "With statement_timeout = 5s on the orders role, runaway queries are cancelled instead of holding pool connections. Over a week p99 latency of the orders endpoint dropped from 4.2 s to 1.1 s, while 0.02 % of requests got 503 from cancelled statements."

