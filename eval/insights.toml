kind = "gotcha"
scope = "solution"
area = "backend"
title = "SET statement_timeout per session is lost behind pgbouncer transaction pooling"
body = "The service ran SET statement_timeout = '5s' once after connecting. With pgbouncer in transaction pooling mode the next transaction may run on another server connection, so most queries ran without the limit and a slow report held connections for minutes. The limit must be set per role or with SET LOCAL inside the transaction."

[[insight]]
key = "k07-n"
