# ---- p16: SQLite и потоки ----

[[insight]]
key = "p16-h"
lang = "en"
kind = "gotcha"
scope = "solution"
area = "backend"
certainty = "hypothesis"
contradicts = ["p16-t"]
title = "SQLite cannot be used from more than one thread"
body = "SQLite is single-threaded: opening the database from several threads corrupts it, so the export worker must funnel every query through one thread."

[[insight]]
key = "p16-t"
lang = "en"
kind = "gotcha"
scope = "solution"
area = "backend"
certainty = "theorem"
title = "SQLite is safe to use from several threads in its default serialized mode"
body = "The default SQLite build uses the serialized threading mode, so connections may be used from several threads; the usual pattern is one connection per thread. Thread safety does not depend on the journal mode: WAL only lets readers run in parallel with the single writer instead of waiting for it. Problems come from builds with SQLITE_THREADSAFE=0 or from sharing one connection between threads in multi-thread mode (SQLITE_OPEN_NOMUTEX), not from threads as such."
evidence = { checked = "export worker with 8 threads, one connection per thread, WAL mode", method = "stress test of one hour and PRAGMA integrity_check afterwards", result = "no errors except handled SQLITE_BUSY, integrity_check returned ok" }

