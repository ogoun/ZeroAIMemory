# Набор эталона подсказок-идей M5.7 (спецификация M6 §16 «Долги M5.7», задача плана 1a2):
# запросы `prompt` к 50 идеям `eval/sessions-corpus/ideas/ideas.toml`. Эталон
# `crates/zam-server/tests/fixtures/idea_hints_m57.json` снимается бинарником тега v0.0.10-m5.7
# (`cargo xtask eval --idea-hints eval/idea-hints.toml --server-bin <…> --out <…>`) и фиксирует
# поведение лексического правила M5.7 (`IdeaQuery::matches`, `api/recall.rs`): задачи 9 и 16
# сравнивают с ним топ-5 подсказок-идей после переноса кода и дешёвого поиска. После снятия
# эталона файл не правится — иначе эталон переснимается (тест сверяет blake3 файла).
#
# [[query]]: id (уникальный, `ih-NN`), prompt (текст запроса агента), class:
#   positive — автор ждёт подсказку (expect — идеи `idea:<key>`, любая из них; не пусто);
#   negative — автор ждёт тишину (expect = []); about — идеи, на которые запрос похож лексически,
#     но которые подсказываться не должны (не кандидаты: агент, proposed, declined, accepted с
#     живой задачей, done, deferred до горизонта) или совпадают только телом / служебным словом.
# note — зачем запрос в наборе. Ожидания автора справочные: эталон — фактический ответ M5.7.
#
# Состав (проверяет `cargo xtask eval --check`): положительные и отрицательные — по ≥ 15; длинные
# запросы (> 30 слов) ≥ 4; идеи всех семи состояний корпуса — в expect или about.

