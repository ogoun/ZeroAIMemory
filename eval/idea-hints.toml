[[query]]
id = "ih-35"
prompt = "Посмотри, пожалуйста, модуль бухгалтерской выгрузки: продавцы жалуются, что раз в месяц им приходится вручную собирать данные о продажах, а хотелось бы, чтобы кабинет сам делал экспорт отчётов в PDF, который можно сразу отправить в бухгалтерию без правок; заодно проверь, что даты в отчёте идут по часовому поясу продавца."
class = "positive"
expect = ["idea:i01"]
note = "длинный запрос в стиле Claude Code: порог ограничен словами идеи"

[[query]]
id = "ih-36"
prompt = "We keep losing customers at the last step: the checkout form asks for the full delivery address every time, there is no address autocomplete for street and house, and returning customers cannot pick one of their saved addresses, so please look at how the checkout page collects the address and what it would take to improve it."
class = "positive"
expect = ["idea:i16", "idea:i18"]
note = "длинный английский запрос, две близкие идеи"

[[query]]
id = "ih-37"
prompt = "Разберись с уведомлениями: покупатели пишут в поддержку, что не понимают, на каком этапе их заказ, письма о смене статуса заказа приходят не всегда, а пуши иногда дублируются; нужно понять, что из этого уже есть в коде, и предложить, как сделать уведомления о статусе заказа надёжными."
class = "positive"
expect = ["idea:i06", "idea:i08"]
note = "длинный запрос; рядом i09 (агент, не кандидат)"

[[query]]
