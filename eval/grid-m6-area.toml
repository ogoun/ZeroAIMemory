# M6 §11 (задача 11): буст текущей области search.boost_area — bge-m3-fp16 cuda, mode = hybrid.
#   cargo xtask eval --grid eval/grid-m6-area.toml
# Части: main — eval/queries.toml (запросы без области: контроль); area — eval/area-queries.toml
# (независимый набор, 36 запросов), отчёт по видам area_same / area_other / area_none.
# Первая конфигурация — без буста (1,0): база условий other/none; вторая база — 1,10 (v0.0.9).
# Во всех точках recency_half_life_days = 0 (A/A побайтово, методика); A/A — K = 3.
# Правило выбора — журнал задачи 11 (записано до прогона).
model = "bge-m3-fp16"
device = "cuda"
mode = "hybrid"
aa = true
aa_k = 3
second_base = "area-1.10"

[[part]]
name = "area"
queries = "eval/area-queries.toml"

[[config]]
name = "area-1.0"
set = { "search.boost_area" = "1.0", "search.recency_half_life_days" = "0" }

[[config]]
name = "area-1.05"
set = { "search.boost_area" = "1.05", "search.recency_half_life_days" = "0" }

[[config]]
name = "area-1.10"
set = { "search.boost_area" = "1.10", "search.recency_half_life_days" = "0" }

[[config]]
name = "area-1.20"
set = { "search.boost_area" = "1.20", "search.recency_half_life_days" = "0" }

[[config]]
name = "area-1.30"
set = { "search.boost_area" = "1.30", "search.recency_half_life_days" = "0" }
