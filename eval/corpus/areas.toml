# Области целей корпуса (спецификация M6 §11, задача 1c): путь заметки → backend | frontend |
# infra. Загрузчик шлёт область заголовком X-Zam-Area при POST /nodes (сервер берёт из него
# область узла, ТЗ §11.2). Область insight — поле `area` в eval/insights.toml. Заметки без
# строки здесь — без области (запросы `none` набора областей, задача 11).

[area]
# ---- backend: сервисы, API, базы ----
"ru/api/http-client-retries" = "backend"
"en/api/product-cache-invalidation" = "backend"
"ru/api/structured-logging" = "backend"
"en/api/database-statement-timeout" = "backend"
"en/api/feature-flag-evaluation" = "backend"
"ru/api/jwt-validation" = "backend"
"ru/api/keyset-pagination" = "backend"
"en/api/timestamps-utc" = "backend"
"ru/api/rate-limiting-token-bucket" = "backend"
"en/api/health-endpoint-design" = "backend"
# одноязычные соседи другой области (правки ревью 1c): к k02, k04, k08
"en/api/idempotency-keys" = "backend"
"ru/api/redis-cache-ttl" = "backend"
"ru/api/service-request-timeouts" = "backend"
"en/db/connection-pool-exhaustion" = "backend"
"en/db/postgres-explain-analyze" = "backend"
"ru/db/postgres-zero-downtime-migrations" = "backend"
"ru/db/sqlite-busy-timeout" = "backend"
"ru/ops/retries-backoff-jitter" = "backend"
"en/long/payment-webhooks-reliability" = "backend"
"en/long/api-versioning-guide" = "backend"
"en/long/postgres-index-tuning-notes" = "backend"
"ru/long/kafka-consumer-lag-analysis" = "backend"

# ---- frontend: витрина, кабинет продавца, сборка фронтенда ----
