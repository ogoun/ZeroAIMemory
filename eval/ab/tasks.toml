# Шаблон задач агентного A/B (спецификация M6 §12, задача 12). Прогон — владелец, вне приёмки
# M6: ≥ 10 задач × 2 плеча × 2 повтора; инструкция — eval/README.md, «Агентный A/B».
#
# Каждая задача решается в **чистом** worktree репозитория ZeroAIMemory от одного коммита
# (`base` ниже; по умолчанию — тег выпуска M6) новой сессией агента: текст `prompt` — первое
# сообщение без подсказок. Готово — когда агент сам считает задачу решённой; затем владелец
# запускает `check` в том же worktree: исход `pass`, если код выхода 0 **и** вывод содержит
# `expect`, иначе `fail` (метка — в eval/ab/runs.toml). Правки задачи в основной репозиторий не
# переносятся: worktree после прогона удаляется.
#
# Задачи выбраны так, чтобы ответ требовал знания проекта (где лежит код, какие правила
# приняты): память и карта кода могут это знание дать. Имя теста `ab_tNN` уникально — проверка
# считает ровно один пройденный тест (без него `cargo test` с фильтром проходит с 0 тестов).

base = "v0.0.11-m6"

# Плечи §12. Каждое сравнение — пара; в одном прогоне владельца достаточно одной пары.
[[arms]]
name = "memory"
desc = "хуки ZeroAIMemory включены, MCP `zam mcp` подключён (обычная установка `zam init`)"
[[arms]]
name = "off"
desc = "хуки выключены и MCP не подключён: `[hooks]` все ключи false в .zeroaimemory/config.toml, без .mcp.json"
[[arms]]
name = "map"
desc = "как memory, карта кода синхронизирована (`zam code sync`), `[hooks] code_map = true`"
[[arms]]
name = "nomap"
desc = "как memory, но `[hooks] code_map = false` (без строки карты и раздела «Код»)"
[[arms]]
name = "impact"
desc = "как memory, `[hooks] checkpoint_impact = true` (строки влияния правки в напоминании Stop)"
[[arms]]
name = "noimpact"
desc = "как memory, `[hooks] checkpoint_impact = false` (по умолчанию)"

[[task]]
id = "t01"
prompt = """В клиенте `zam` есть функция процентного кодирования сегмента пути URL для id сессии \
хуков. Найди её и добавь юнит-тест `ab_t01` рядом с её тестами: id `a:b/c d` кодируется в \
`a%3Ab%2Fc%20d`."""
check = "cargo test -p zam-cli --bin zam ab_t01"
expect = "test result: ok. 1 passed"

[[task]]
id = "t02"
prompt = """В поиске есть правило покрытия слов ошибки для подсказок post_tool (делитель, \
предел и правило совпадения слов), умолчание которого выбрано в M6. Добавь юнит-тест `ab_t02`, \
который фиксирует значения умолчания M6 — возьми их из кода и журнала этапа, не меняя код."""
check = "cargo test -p zam-search ab_t02"
expect = "test result: ok. 1 passed"

[[task]]
id = "t03"
prompt = """Нормализация текста ошибки для поиска подсказок убирает пути, числа и прочий шум. \
Найди функцию и добавь тест `ab_t03`: два текста одной ошибки компилятора с разными путями \
файлов и номерами строк нормализуются одинаково."""
check = "cargo test -p zam-search ab_t03"
expect = "test result: ok. 1 passed"

[[task]]
id = "t04"
prompt = """В хранилище есть функция предела бюджета выдачи (запас на погрешность счётчика \
токенов). Добавь тест `ab_t04`: результат не больше бюджета и не меньше 1 для бюджетов 1, 100, \
800, 2000."""
check = "cargo test -p zam-store ab_t04"
expect = "test result: ok. 1 passed"

[[task]]
id = "t05"
prompt = """Маскировка токена доступа для логов и Debug-вывода есть в общем крейте. Добавь тест \
`ab_t05`: в маске токена `zam_` + 40 символов не встречается ни одна подстрока токена длиннее \
8 символов."""
check = "cargo test -p zam-core ab_t05"
expect = "test result: ok. 1 passed"

[[task]]
id = "t06"
prompt = """У хука subagent-start id сессии субагента строится из id родителя и agent_id, с \
ограничением длины. Добавь тест `ab_t06`: для родителя длиной 200 символов id детерминирован, \
не длиннее предела и различается для разных agent_id."""
check = "cargo test -p zam-cli --bin zam ab_t06"
expect = "test result: ok. 1 passed"

[[task]]
id = "t07"
prompt = """Напоминание хука checkpoint о задачах журнала строит строку про next_step по ответу \
GET /sessions/{id}. Добавь тест `ab_t07`: задачи со статусом open и done в строку не попадают, \
а in_progress — попадают, не больше трёх."""
check = "cargo test -p zam-cli --bin zam ab_t07"
expect = "test result: ok. 1 passed"

[[task]]
id = "t08"
prompt = """Стенд A/B xtask разбирает транскрипты агентов. Добавь тест `ab_t08`: строка Codex \
`token_count` с `info: null` не сбрасывает уже накопленный итог."""
check = "cargo test -p xtask ab_t08"
expect = "test result: ok. 1 passed"

[[task]]
id = "t09"
prompt = """Строка знания о файле у хуков post-tool/pre-tool собирается из записей индекса \
file-refs. Добавь тест `ab_t09`: записи со ссылкой на символ идут первыми, устаревшие помечены \
«возможно устарело»."""
check = "cargo test -p zam-cli --bin zam ab_t09"
expect = "test result: ok. 1 passed"

[[task]]
id = "t10"
prompt = """Сервер принимает `POST /sessions` с прибавкой токенов хуков с локальным выводом. \
Добавь интеграционный тест `ab_t10` в тесты сессий сервера: неизвестное событие в `tokens` — \
400, а `{calls, tokens}` у `pre_tool` прибавляется к учёту сессии."""
check = "cargo test -p zam-server --test sessions ab_t10"
expect = "test result: ok. 1 passed"
