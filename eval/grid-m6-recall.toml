env = { ZAM_RECALL__BRIEF_TOKENS = "500", ZAM_CODE__BRIEF_TOKENS = "150" }

[[point]]
name = "b800-c100"
env = { ZAM_RECALL__BRIEF_TOKENS = "800", ZAM_CODE__BRIEF_TOKENS = "100" }

[[point]]
name = "b500-c100"
env = { ZAM_RECALL__BRIEF_TOKENS = "500", ZAM_CODE__BRIEF_TOKENS = "100" }
