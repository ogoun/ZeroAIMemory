# Eval документов M5 (спецификация §6, задача 10): запросы к фактам набора `eval/docs/`
# (`cargo xtask docs-corpus`; факты — `manifest.json`, дословное `evidence` в известном месте).
#
# Поля: `id`, `text`, `lang` (ru | en | zh | ja), `kind`, `fact` — id факта манифеста.
# Виды:
#   exact      — значимые слова факта (FTS находит по словам);
#   paraphrase — пересказ своими словами (общих слов мало или нет — работает векторный канал);
#   cross-lang — запрос на другом языке, чем документ;
#   date       — строка листа XLSX ищется по дате (ячейка с датой, стиль numFmt); в тексте
#                извлечения дата — как в Excel для своего числового формата (`dd.mm.yyyy`),
#                иначе ISO 8601 (`EXTRACTOR_VERSION` 3); форма даты в запросе — разная.
# Метрики — `cargo xtask eval --docs`: recall@5 по вложению (файл факта в первых 5), точность
# `locator` (текст `/read` по `locator` карточки содержит `evidence`) и совпадение `locator`
# с эталоном (страница, слайд, ячейка листа; у DOCX — абзац в единице).

