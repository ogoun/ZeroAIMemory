# Набор областей (M6 §11, задача 11): 36 запросов для проверки буста текущей области поиска.
# Составил независимый агент без доступа к коду поиска, сеткам и результатам прогонов; разметка —
# только по смыслу (какой документ отвечает на вопрос). Формат — eval/README.md.
# Область цели: заметка — eval/corpus/areas.toml, insight — поле `area` в eval/insights.toml.
#
# Раскладка:
#   area_kind: same 12, other 12, none 12
#   area:      backend 12, frontend 12, infra 12 (по 4 в каждом виде area_kind)
#   lang:      ru 18, en 18
#   kind:      paraphrase 14, cross-lang 14, identifier 4, exact 2, broad 2
#   (по штатной проверке: aq-28 — kind = cross-lang; у aq-05 и aq-24 цели на двух языках —
#   метки paraphrase / identifier сохранены, журнал задачи 11)
# Смысл area_kind: same — все цели в текущей области, рядом сосед той же темы из другой;
# other — все цели в другой области; none — все цели без области.

# ---- same: ответ в текущей области ----

[[query]]
id = "aq-01"
text = "сколько повторов допускать при сбое внешней зависимости, какие паузы и бюджет, чтобы повторы не добили её окончательно"
lang = "ru"
expect = ["ru/api/http-client-retries", "ru/ops/retries-backoff-jitter"]
kind = "broad"
area = "backend"
area_kind = "same"

[[query]]
id = "aq-02"
