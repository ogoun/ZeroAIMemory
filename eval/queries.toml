text = "why did clients take fifteen seconds to notice a partitioned Redis node"
lang = "en"
expect = ["en/long/redis-cluster-migration"]
kind = "chunk"
evidence = "When we repeated the test by dropping packets to the node with a firewall rule instead of killing the process, clients took up to fifteen seconds to notice, because our client timeouts were set to ten seconds for commands and the cluster topology refresh happened only after a timeout. We lowered the command timeout to two seconds for latency-sensitive services and enabled periodic topology refresh every thirty seconds, after which the partition test showed recovery within about eight seconds, in line with what we then saw in production."

