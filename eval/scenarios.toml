# Сценарии расхода токенов eval M4 (ТЗ §9.3, §18.2; задача 15 M4): вопрос агента → источники,
# которые агент должен прочитать, чтобы ответить. Формат и правила — eval/README.md, раздел
# «Расход токенов».
#
# Прогон `cargo xtask eval --tokens` на корпусе eval/corpus и insight eval/insights.toml для каждого
# сценария меряет три пути (у каждого — своя сессия `X-Zam-Session`):
# - (а) протокол §9.3: `POST /search` `mode=brief` (md, бюджет по умолчанию 800) → агент выбирает
#   из карточек ожидаемые источники → `POST /read` выбранных (md, L2, бюджет 4000 — как у пути
#   (в)) → `POST /cache` выжимки;
# - (б) повтор того же вопроса другой сессией: `POST /search` `mode=brief` — выжимка кэша первым
#   элементом;
# - (в) «наивный» путь: `POST /search` `mode=chunks`, `budget_tokens = 4000`, без кэша.
# Метрика — токены ответов сервера (токенизатор bge-m3) и полнота: все ожидаемые источники
# прочитаны (а), выжимка действительна и основана на них (б), есть в выдаче (в).
#
# `expect` — пути заметок корпуса, `insight:<key>` или документ набора `doc:<путь в eval/docs>`;
# вопросы — своими словами агента, не текст запросов queries.toml.
#
# M6 (ТС-1, спецификация M6 §3.1–§3.2, задача 1b): 48 сценариев, `kind` — слой разбиения dev/holdout
# (long, insight, attachment, multi, single, pair), `nuggets` — дословные фрагменты источников,
# без которых ответа нет. Набор заморожен (eval/nuggets.lock): правка — только при доказанной
# ошибке разметки, с записью в журнал M6, новым замком и переснятием всех плеч.

[[scenario]]
id = "s-01"
kind = "pair"
question = "почему bash-скрипт из репозитория падает в Linux, а на Windows всё нормально, и как настроить git"
expect = ["ru/windows/crlf-bash-scripts", "ru/windows/git-autocrlf-gitattributes"]
nuggets = [
  { source = "ru/windows/crlf-bash-scripts", text = "при `core.autocrlf=true` он при checkout переписывает LF в CRLF, и скрипт портится уже в рабочем каталоге" },
  { source = "ru/windows/crlf-bash-scripts", text = "Переменная, прочитанная через `read` из файла с CRLF, содержит хвостовой `\\r`" },
  { source = "ru/windows/git-autocrlf-gitattributes", text = "Атрибуты из `.gitattributes` имеют приоритет над `core.autocrlf`, поэтому при наличии полного файла атрибутов личная настройка разработчика почти ни на что не влияет" },
  { source = "ru/windows/git-autocrlf-gitattributes", text = "Установщик Git for Windows по умолчанию предлагает `true`." },
  { source = "ru/windows/git-autocrlf-gitattributes", text = "Правило `*.sh text eol=lf` убирает зависимость от настроек агента." },
]

