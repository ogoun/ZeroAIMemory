[[scenario]]
id = "s-05"
kind = "pair"
question = "container got killed with exit code 137, was it the container limit or the host OOM killer"
expect = ["en/linux/oom-killer-dmesg", "en/docker/exit-code-137-container-oom"]
nuggets = [
  { source = "en/linux/oom-killer-dmesg", text = "`constraint=CONSTRAINT_NONE` means the whole machine ran out of memory, not a cgroup." },
  { source = "en/linux/oom-killer-dmesg", text = "If it says `CONSTRAINT_MEMCG`, the limit of a cgroup (a systemd slice or a container) was hit instead" },
  { source = "en/linux/oom-killer-dmesg", text = "dmesg -T | grep -i -E \"out of memory|oom-kill|killed process\"" },
  { source = "en/docker/exit-code-137-container-oom", text = "docker inspect --format '{{.State.OOMKilled}} {{.State.ExitCode}}' worker" },
  { source = "en/docker/exit-code-137-container-oom", text = "`OOMKilled` is reliable only when the killed process is PID 1 of the container." },
  { source = "en/docker/exit-code-137-container-oom", text = "The kernel's cgroup OOM handling kills a process inside that cgroup even if the host has free RAM" },
]

