expect = ["en/long/dns-outage-postmortem"]
nuggets = [
  { source = "en/long/dns-outage-postmortem", text = "the resolver software used one shared pool of workers for all queries, with no isolation between forwarded zones and everything else" },
  { source = "en/long/dns-outage-postmortem", text = "slow forwarded queries exhausted the pool and blocked resolution of every other name" },
  { source = "en/long/dns-outage-postmortem", text = "The resolver supports a per-upstream limit on concurrent queries, which would have contained the damage, but it was not configured." },
  { source = "en/long/dns-outage-postmortem", text = "For forwarded zones inside our own network, an answer that does not arrive within a few hundred milliseconds is not going to arrive." },
]

