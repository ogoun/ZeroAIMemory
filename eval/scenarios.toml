  { source = "ru/windows/powershell-encoding", text = "Программа пишет UTF-8, PowerShell читает как 866" },
  { source = "ru/windows/powershell-encoding", text = "В 5.1 по умолчанию это ASCII, и вся кириллица превращается в `?`." },
  { source = "ru/windows/cmd-chcp-65001", text = "Если BOM есть, cmd воспримет его как часть первой команды, и `@echo off` не сработает" },
