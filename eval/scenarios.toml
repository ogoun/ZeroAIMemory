[[scenario]]
id = "s-12"
kind = "pair"
question = "what are the alternatives to single-vector dense retrieval: late interaction and learned sparse"
expect = ["en/research/colbert-late-interaction", "en/research/learned-sparse-splade"]
nuggets = [
  { source = "en/research/colbert-late-interaction", text = "Each query token finds its best-matching document token (MaxSim), and the maxima are summed." },
  { source = "en/research/colbert-late-interaction", text = "Storage is the main issue: one vector per token instead of one per passage." },
  { source = "en/research/colbert-late-interaction", text = "compute MaxSim on 100 candidates, no special index needed" },
  { source = "en/research/colbert-late-interaction", text = "ColBERTv2 (Santhanam et al., 2022) stores each token vector as a centroid id plus a quantized residual" },
  { source = "en/research/learned-sparse-splade", text = "Terms that never appear in the text can get non-zero weight (\"car\" activates \"vehicle\")." },
  { source = "en/research/learned-sparse-splade", text = "A FLOPS regularizer penalizes the expected number of shared non-zero terms between queries and documents" },
  { source = "en/research/learned-sparse-splade", text = "only tokens actually present in the input get a weight (no expansion)" },
]

