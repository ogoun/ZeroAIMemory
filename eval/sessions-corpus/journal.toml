# Корпус ТС-2 (спецификация M6 §3.1, задача 1c): журналы решения проекта «магазин».
#
# [[task]] — задача (`kind: task`): key, lang, title, body?, status (open | in_progress |
# blocked | done | dropped), next_step?, blocked_by? (обязателен у blocked).
# [[question]] — вопрос к человеку (`kind: question`): key, lang, title, body?, options?
# ({key, text}), recommendation?; answer = {option?, text?} — ответ человека (загрузчик
# отвечает `POST /entries/{id}/answer` с `by: human`), без answer — вопрос открыт.
# [[access]] — ожидающий запрос доступа к решению (ТЗ §11.6): key, user — логин второго
# пользователя, которого создаёт загрузчик.

# ---- задачи ----

[[task]]
key = "t-export-stream"
lang = "ru"
title = "Потоковая выгрузка заказов в CSV"
body = "Выгрузка заказов обрывается с 504 на больших периодах. Переделать на потоковую отдачу без сборки файла в памяти."
status = "in_progress"
next_step = "проверить выгрузку за квартал на стенде и сравнить память сервиса"

[[task]]
key = "t-token-refresh"
lang = "en"
title = "Single-tab access token refresh in the storefront"
body = "Users with several tabs get logged out after refresh token reuse detection. Refresh in one tab and share the token through BroadcastChannel."
status = "in_progress"
next_step = "add an e2e test with three tabs and 30 s token lifetime"

[[task]]
key = "t-upload-limits"
lang = "ru"
title = "Поднять предел размера прайс-листа до 50 МБ на всех стендах"
body = "На новом стенде импорт прайс-листов больше 1 МБ получает 413."
status = "blocked"
blocked_by = "ждём доступ к репозиторию конфигурации шлюза от команды инфраструктуры"
next_step = "вынести client_max_body_size в общий шаблон стенда"

[[task]]
key = "t-flags-snapshot"
lang = "en"
title = "Persist the flag rule set snapshot for service restarts"
body = "After the flag service outage the checkout was disabled by defaults. Load the last rule set from disk when the flag service is unreachable."
status = "blocked"
blocked_by = "flag SDK 4.2 with snapshot support is not released yet"

[[task]]
key = "t-keyset-orders"
lang = "ru"
title = "Перевести выгрузку партнёру на keyset-пагинацию"
status = "open"
next_step = "добавить индекс (created_at, id) миграцией"

[[task]]
key = "t-health-cache"
lang = "en"
title = "Cache dependency checks of /health"
status = "done"

[[task]]
key = "t-price-import"
lang = "ru"
title = "Фоновый импорт прайс-листов с отчётом об ошибках строк"
body = "Импорт прайс-листа идёт в запросе и падает по тайм-ауту на больших файлах."
status = "in_progress"
next_step = "вынести разбор в очередь задач и отдавать продавцу отчёт по строкам"

[[task]]
key = "t-cdn-cache"
