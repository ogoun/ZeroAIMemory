# ---- вопросы к человеку ----

[[question]]
key = "q-export-format"
lang = "ru"
title = "В каком формате отдавать выгрузку заказов партнёрам — CSV или XLSX?"
body = "Партнёры просят Excel, но XLSX нельзя отдавать потоком без сборки файла."
options = [{ key = "csv", text = "CSV, потоком" }, { key = "xlsx", text = "XLSX, фоновой задачей" }]
recommendation = "csv"
answer = { option = "csv", text = "CSV потоком; XLSX позже, если партнёры будут жаловаться" }

[[question]]
key = "q-release-day"
lang = "en"
title = "Can the token refresh fix go out on Friday?"
body = "The fix is small but touches authentication, and Friday releases are for incidents only."
answer = { text = "No, release it on Tuesday together with the e2e test." }

[[question]]
key = "q-flag-default"
lang = "ru"
title = "Какое умолчание у флага new_checkout после удаления старой корзины?"
options = [{ key = "true", text = "true — новая корзина" }, { key = "remove", text = "удалить флаг" }]
answer = { option = "remove", text = "Удалить флаг в ближайшем релизе, до этого умолчание true" }

[[question]]
key = "q-dark-theme"
lang = "ru"
