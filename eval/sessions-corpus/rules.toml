# Корпус ТС-2 (спецификация M6 §3.1, задача 1c): заметки Rules проекта «магазин» — сервисы
# заказов и каталога (Rust), витрина и кабинет продавца (TypeScript), инфраструктура.
#
# [[rule]] — заметка пространства Rules: key (`rule:<key>` в разметке сессий), path (путь в
# Rules), text (Markdown с заголовком `# `). Тяжёлый профиль ТС-2 грузит все (≥ 10),
# стандартный — 2–4 по выбору сессии (eval/sessions.toml, задача 4).

[[rule]]
key = "commits"
path = "process/commits"
text = """
# Коммиты

Сообщения коммитов — Conventional Commits на русском: `feat(orders): что сделано`. Один коммит —
одна логическая правка. В коммит попадают только пути задачи, без локальных файлов настроек.
"""

[[rule]]
key = "migrations"
path = "backend/migrations"
text = """
# Миграции базы

Миграции Postgres только добавляют: новая колонка — с умолчанием или nullable, удаление колонки
— отдельным релизом после того, как код перестал её читать. Каждая миграция проверяется на
копии продакшен-базы, время блокировки записывается в описание задачи.
"""

[[rule]]
key = "secrets"
path = "security/secrets"
text = """
# Secrets

Secrets never go into the repository, build arguments, frontend bundles or logs. Services read
them from Vault at startup. A secret that leaked into a commit is rotated first and removed from
history second.
"""

[[rule]]
key = "api-compat"
path = "backend/api-compatibility"
text = """
# Совместимость API

Публичный API меняется только с сохранением совместимости: новые поля — необязательные, старые
не удаляются без новой версии `/v2`. Изменение контракта сопровождается правкой OpenAPI в том
же коммите.
"""

[[rule]]
key = "tests"
path = "process/tests"
text = """
# Tests

Every bug fix comes with a test that fails without the fix. Integration tests use the shared
Postgres container of the test stand, never a developer's local database. Flaky tests are
quarantined within a day, with a task to fix them.
"""

[[rule]]
key = "deps"
path = "process/dependencies"
text = """
# Зависимости

Новая библиотека (crate или npm-пакет) добавляется только после проверки лицензии (MIT,
Apache-2.0, BSD) и записи в журнал задачи. Версии фиксируются lock-файлом, обновления — отдельным
коммитом.
"""

[[rule]]
key = "frontend-a11y"
path = "frontend/accessibility"
text = """
# Accessibility

Every interactive element of the storefront is reachable from the keyboard and has an accessible
name. Colour contrast is at least 4.5:1. New components get an axe check in their e2e test.
"""

[[rule]]
key = "release"
path = "process/release"
text = """
# Релизы

Релиз выкатывается по вторникам и четвергам до 15:00. Перед выкаткой — зелёный CI и запись в
канале релизов. В пятницу и перед праздниками выкатываются только исправления инцидентов.
"""

[[rule]]
key = "logging"
path = "backend/logging"
text = """
# Журналы

Журналы сервисов — JSON через `tracing`. В журнал не пишутся тела запросов, токены, телефоны и
адреса почты. Ошибки клиента (4xx) — уровень INFO, ERROR — только то, что требует действия
человека.
"""

[[rule]]
key = "infra-changes"
path = "infra/changes"
text = """
# Infrastructure changes

Infrastructure is changed only through the configuration repository and the deploy pipeline.
Manual changes on servers are forbidden: the next deploy overwrites them. Every change to nginx
limits or timeouts is first rolled out to the staging stand.
"""

[[rule]]
key = "tmp-files"
path = "process/temporary-files"
text = """
# Временные файлы

Временные файлы, логи прогонов и выгрузки для отладки — только в каталоге `.tmp/` проекта. Системный
temp не используется. Выгрузки с данными покупателей удаляются в тот же день.
"""

[[rule]]
key = "reviews"
path = "process/code-review"
text = """
# Code review

A change is merged after one approval from the owning team. The author answers every comment
before merging. Changes to payments, authentication and migrations need a second reviewer.
"""

# ---- задача 4 M6 (ревью): Rules 13–20 — миры тяжёлого профиля до RULES_MAX = 20 ----

[[rule]]
key = "payments-idempotency"
path = "backend/payments-idempotency"
text = """
# Идемпотентность платежей

Каждый запрос к платёжному провайдеру несёт ключ идемпотентности из номера заказа и попытки.
Повтор после тайм-аута идёт с тем же ключом: новый ключ на повторе означает двойное списание.
"""

[[rule]]
key = "feature-flags"
path = "process/feature-flags"
text = """
# Feature flags

Every flag has an owner and a removal date in its description. A flag older than two releases
after full rollout is removed together with its dead code branch in the next release.
"""

[[rule]]
key = "metrics"
path = "backend/metrics"
text = """
# Метрики сервисов

Метрики — в формате Prometheus с префиксом имени сервиса. Метка не может содержать id заказа,
пользователя или адрес: высокая кардинальность роняет хранилище метрик.
"""

[[rule]]
key = "db-indexes"
path = "backend/db-indexes"
text = """
# Indexes

New indexes on large tables are created with CREATE INDEX CONCURRENTLY in a migration of their
own. The query plan before and after is attached to the task.
"""

[[rule]]
key = "errors-api"
path = "backend/api-errors"
text = """
# Ошибки API

Ошибки API отдаются в формате problem+json с полем code. Текст ошибки не раскрывает SQL,
пути файлов и имена внутренних сервисов.
"""

[[rule]]
key = "i18n"
path = "frontend/i18n"
text = """
# Translations

User-facing strings of the storefront live in the locale files only; a hard-coded string in a
component fails the lint step. Russian and English locales are updated in the same commit.
"""

[[rule]]
key = "cache-headers"
path = "frontend/cache-headers"
text = """
# Заголовки кэша

Статика витрины с хэшем в имени отдаётся с Cache-Control immutable на год. HTML и /config.json
— только no-cache: иначе после релиза покупатели получают старую сборку.
"""

[[rule]]
key = "oncall"
path = "process/on-call"
text = """
# On-call

The on-call engineer acknowledges a page within fifteen minutes. A production change during an
incident is announced in the incident channel before it is made.
"""
