# Корпус ТС-2: 50 идей проекта «магазин» (спецификация M6 §3.1, §3.3, задача 16; задачи плана
# 1c, 1a2). Фикстура эталона подсказок-идей M5.7 (`eval/idea-hints.toml`, задача 1a2) и идеи
# сессий ТС-2 (задача 4); микрозамер лёгкого поиска идей (задача 16) — на этих же 50.
#
# [[idea]]: key (`idea:<key>` в разметке), lang, title, body?, priority? (low | normal | high,
# нет — normal), origin (human | agent), state — состояние после загрузки:
#   new | deferred (horizon_days — горизонт: дата прогона UTC + дни, 0 — наступил) | proposed |
#   declined | accepted (задача «начать» жива) | released (accepted, задача снята — dropped) |
#   done (задача выполнена).
# Идея агента — только new: решения по идее принимает человек (M5.7).
#
# Разнообразие для эталона (проверяет `cargo xtask eval --check`):
# - общие глаголы в заголовках («Добавить», «Сделать», «Fix», «Add»…) — материал стоп-основ
#   идей задачи 16 (служебное слово — стоп-основа + не больше 3 символов);
# - «ложные друзья» стоп-основ: changelog, makefile, address, модульный, файловый,
#   функциональный, тестировщик — служебными не считаются;
# - темы с общими основами у нескольких идей (экспорт, отчёт, уведомления, кэш, поиск) —
#   порядок топ-5 и пороги совпадения;
# - короткие слова (PDF, CSV, API, SMS), служебные слова в заголовках;
# - живая и снятая задача у принятых идей, наступивший и будущий горизонт у отложенных.

