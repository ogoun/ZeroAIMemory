# Набор ТС-2 «сессия» (спецификация M6 §3.1, §3.3; задача 4 плана): сессии агента в проекте
# «магазин» на корпусе eval/sessions-corpus/. Прогон — `cargo xtask eval --sessions --split
# dev|holdout [--profile standard|heavy] [--ideas on|off] [--base B4|B5.6|B5.7]`, формат и
# метрики — eval/README.md, раздел «Набор ТС-2 (сессии)».
#
# [[session]]:
# - id — `ss-NN` (стандартный профиль) или `sh-NN` (тяжёлый); profile — standard | heavy
#   (слой разбиения dev/holdout);
# - мир сессии — ключи корпуса eval/sessions-corpus (`"*"` — все записи файла): rules, tasks,
#   questions (вопросы journal.toml; с answer — ответ человека), access (запросы доступа),
#   terms (словарь), insights, ideas; code_map — карта кода по фикстуре
#   eval/sessions-corpus/code (`zam code sync`);
# - digest_ideas — идеи раздела `### Идеи` первого session_start (до 3, как отбирает M5.7:
#   new и deferred с наступившим горизонтом от человека — high, normal, low, внутри — новые
#   первыми; затем accepted со снятой задачей; сверено прогоном B5.7 на dev) — обязательные
#   строки дайджеста;
# - transcript — фикстура журнала агента для снимка сессии (§8а; заполняет задача 17d).
#
# [[session.event]] по порядку; первый `session_start` (startup) и его повтор другой сессией
# (совпадение дайджеста) ставит раннер. type:
# - prompt {text, expect} — `zam hook prompt`; expect — ожидаемые подсказки (`insight:`,
#   `rule:`, `term:`, `idea:`); подсказка показывается раз за сессию, поэтому ожидаемая считается
#   выданной и тогда, когда она уже была раньше (правило и идея — в дайджесте);
# - question {id, query, expect, nuggets} — вопрос по протоколу ТС-1 через `zam mcp`
#   (memory_search brief → оракул → memory_read 4000 → дочитывание → memory_cache_put); expect —
#   источники (`rule:`/`insight:`), nuggets — {source, text}, дословно из источника;
# - repeat {of} — повтор вопроса `of` той же сессией (без memory_cache_put);
# - tool_error {command, error, expect} — `pre-tool` Bash и `post-tool` с ошибкой;
# - read_file {path, expect} — `pre-tool` Read и успешный `post-tool` Read (знание о файле);
# - subagent {agent_type, task, queries} — `pre-tool` Agent, `subagent-start`, memory_search
#   субагента через тот же `zam mcp` (учитывается в сессии родителя);
# - compact — `checkpoint` PreCompact и `session-start` source=compact (пакет восстановления);
# - checkpoint — `checkpoint` Stop.

