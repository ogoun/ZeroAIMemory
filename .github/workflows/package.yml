# Переиспользуемый конвейер: сборка, упаковка и smoke-тест комплектов обеих платформ.
# Вызывается из ci.yml (без публикации) и release.yml (с загрузкой архивов для publish).
# Артефакт web-dist должен быть загружен вызывающим workflow (job web).
name: Package

on:
  workflow_call:
    inputs:
      version:
        description: "Версия комплекта; ведущая v отбрасывается (v0.0.1-m0 -> 0.0.1-m0)"
        type: string
        required: true
      upload:
        description: "Загрузить архивы как артефакты dist-<платформа> (для publish)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            ext: zip
            cli_bin_arg: ""
          - os: ubuntu-22.04
            platform: linux-x64
            ext: tar.gz
            cli_bin_arg: "--cli-bin target/x86_64-unknown-linux-musl/release/zam"
    defaults:
      run:
        shell: bash
    env:
      # ring (rustls в ureq) под musl собирается C-компилятором musl-gcc.
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web dependencies (для отчёта о лицензиях)
        run: npm ci
        working-directory: web
      - name: musl-tools
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Версия совпадает с rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: кэш зависимостей поставки
        uses: actions/cache@v4
        with:
          path: target/deps-cache
          key: deps-${{ matrix.platform }}-${{ hashFiles('deploy/*.toml') }}
      - name: fetch-deps
        run: cargo xtask fetch-deps --platform ${{ matrix.platform }}
      # ZAM_GIT_SHA — только на шагах сборки: это сборочная переменная build.rs.
      - name: build (windows)
        if: matrix.platform == 'windows-x64'
        env:
          ZAM_GIT_SHA: ${{ github.sha }}
        run: cargo build --release -p zam-server -p zam-cli
      - name: build (linux)
        if: matrix.platform == 'linux-x64'
        env:
          ZAM_GIT_SHA: ${{ github.sha }}
        run: |
          cargo build --release -p zam-server
          cargo build --release -p zam-cli --target x86_64-unknown-linux-musl
      - name: package
        env:
          VERSION: ${{ inputs.version }}
        run: cargo xtask package --platform ${{ matrix.platform }} --flavor cpu --version "${VERSION#v}" ${{ matrix.cli_bin_arg }}
      - name: smoke
        env:
          VERSION: ${{ inputs.version }}
        run: cargo xtask smoke --archive "target/dist/zam-server-${VERSION#v}-${{ matrix.platform }}-cpu.${{ matrix.ext }}"
      - name: артефакты
        if: inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            target/dist/zam-*.${{ matrix.ext }}
          if-no-files-found: error
