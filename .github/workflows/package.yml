# Переиспользуемый конвейер: сборка, упаковка и smoke-тест комплектов обеих платформ.
# Вызывается из ci.yml (без публикации) и release.yml (с загрузкой архивов для publish).
# Артефакт web-dist должен быть загружен вызывающим workflow (job web).
#
# Одна задача на платформу: release-бинарники собираются один раз, из них упаковываются оба
# flavor (cpu и gpu) и прогоняются оба smoke. Отдельные задачи на flavor вдвое удлиняли бы
# сборку (самая долгая часть), а передача бинарников артефактом добавила бы задачу и
# загрузку/выгрузку ради одного exe; место на диске раннера это не экономит, потому что
# распакованные smoke-каталоги удаляются сразу после проверки. Исключение — клиент zam другой
# ОС для раздачи сервером (/downloads/zam/…): его собирает задача cli и передаёт артефактом.
#
# С extras (релиз и пробный прогон release-dry-run) gpu-упаковка собирает ещё zam-cuda своей
# платформы (библиотеки NVIDIA по deploy/cuda.toml, ~1,9 ГБ архивов на Windows и ~2,2 ГБ на
# Linux) и проверяет его (smoke-cuda и smoke GPU-комплекта с распакованным zam-cuda), а
# отдельная задача models собирает архивы zam-models (~2,9 ГБ с Hugging Face; от платформы
# не зависят, бинарники не нужны). Без extras (каждый push) этого не делается: трафик и
# время; zam-cuda на каждое изменение манифеста и кода проверяет cuda.yml.
name: Package

on:
  workflow_call:
    inputs:
      version:
        description: "Версия комплекта; ведущая v отбрасывается (v0.0.1-m0 -> 0.0.1-m0)"
        type: string
        required: true
      upload:
        description: "Загрузить архивы как артефакты dist-* (для проверки состава и publish)"
        type: boolean
        default: false
      extras:
        description: "Собрать zam-cuda (обе платформы) и zam-models"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # zam обеих платформ для раздачи сервером (GET /downloads/zam/{os}-{arch}, §15.5): комплект
  # сервера несёт клиент другой ОС в downloads/<платформа>/. Клиент собирается здесь на своей
  # ОС и передаётся артефактом — кросс-сборка Windows ↔ Linux на раннерах не нужна.
  cli:
    name: cli (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            bin: target/release/zam.exe
          - platform: linux-x64
            os: ubuntu-22.04
            bin: target/x86_64-unknown-linux-musl/release/zam
    defaults:
      run:
        shell: bash
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: musl-tools
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli
      - name: build
        env:
          ZAM_GIT_SHA: ${{ github.sha }}
        run: |
          if [ "${{ matrix.platform }}" = "linux-x64" ]; then
            cargo build --release -p zam-cli --target x86_64-unknown-linux-musl
          else
            cargo build --release -p zam-cli
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zam-cli-${{ matrix.platform }}
          path: ${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 1

  package:
    name: package (${{ matrix.platform }})
    needs: cli
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            ext: zip
            cli_bin_arg: ""
            # zam другой ОС для downloads/ комплекта сервера (задача cli)
            other: linux-x64
            other_exe: zam
          - platform: linux-x64
            os: ubuntu-22.04
            ext: tar.gz
            cli_bin_arg: "--cli-bin target/x86_64-unknown-linux-musl/release/zam"
            other: windows-x64
            other_exe: zam.exe
    defaults:
      run:
        shell: bash
    env:
      # ring (rustls в ureq) под musl собирается C-компилятором musl-gcc.
      CC_x86_64_unknown_linux_musl: musl-gcc
      EXTRAS: ${{ inputs.extras }}
    steps:
      # zam-cuda на Linux: ~2,2 ГБ архивов NVIDIA, ~1,8 ГБ библиотек, ~1,2 ГБ архива и ~1,8 ГБ
      # распаковки в smoke поверх сборки — освобождаем место от ненужных предустановок.
      - name: место на диске (linux, extras)
        if: matrix.platform == 'linux-x64' && inputs.extras
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@v4
        with:
          name: zam-cli-${{ matrix.other }}
          path: target/cli-other
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web dependencies (для отчёта о лицензиях)
        run: npm ci
        working-directory: web
      - name: musl-tools
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Версия совпадает с rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # Архивы зависимостей и тестовая модель smoke; ключ — хэш манифестов deploy/*.toml.
      # Библиотеки NVIDIA не кэшируются: ~2 ГБ вытеснили бы кэш.
      - name: кэш зависимостей поставки и тестовой модели
        uses: actions/cache@v4
        with:
          path: |
            target/deps-cache
            target/models/minilm-l6-int8
          key: deps-${{ matrix.platform }}-${{ hashFiles('deploy/*.toml') }}
      # обе сборки ONNX Runtime: упаковываются оба flavor
      - name: fetch-deps
        run: cargo xtask fetch-deps --platform ${{ matrix.platform }}
      - name: fetch-models (тестовая модель для smoke)
        run: cargo xtask fetch-models --test
      # ZAM_GIT_SHA — только на шагах сборки: это сборочная переменная build.rs.
      - name: build (windows)
        if: matrix.platform == 'windows-x64'
        env:
          ZAM_GIT_SHA: ${{ github.sha }}
        run: cargo build --release -p zam-server -p zam-cli
      - name: build (linux)
        if: matrix.platform == 'linux-x64'
        env:
          ZAM_GIT_SHA: ${{ github.sha }}
        run: |
          cargo build --release -p zam-server
          cargo build --release -p zam-cli --target x86_64-unknown-linux-musl
      - name: package (cpu)
        env:
          VERSION: ${{ inputs.version }}
        run: cargo xtask package --platform ${{ matrix.platform }} --flavor cpu --version "${VERSION#v}" ${{ matrix.cli_bin_arg }} --cli-other target/cli-other/${{ matrix.other_exe }}
      - name: smoke (cpu)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          name="zam-server-${VERSION#v}-${{ matrix.platform }}-cpu"
          cargo xtask smoke --expect-device cpu --archive "target/dist/${name}.${{ matrix.ext }}"
          rm -rf "target/smoke/${name}"
      - name: package (gpu)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${EXTRAS}" = "true" ]; then extra+=(--cuda); fi
          cargo xtask package --platform ${{ matrix.platform }} --flavor gpu \
            --version "${VERSION#v}" ${{ matrix.cli_bin_arg }} \
            --cli-other target/cli-other/${{ matrix.other_exe }} "${extra[@]}"
      - name: smoke-cuda
        if: inputs.extras
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          name="zam-cuda-${VERSION#v}-${{ matrix.platform }}"
          cargo xtask smoke-cuda --archive "target/dist/${name}.${{ matrix.ext }}"
          rm -rf "target/smoke/${name}"
          # библиотеки уже в архиве: распакованная копия больше не нужна
          rm -rf "target/deps/${{ matrix.platform }}/onnxruntime-gpu/cuda"
      # GPU на раннерах нет: GPU-комплект обязан работать на CPU (device=cpu с причиной).
      # С extras в комплект распаковывается zam-cuda, cuda fetch не должен ничего скачать.
      - name: smoke (gpu)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          name="zam-server-${v}-${{ matrix.platform }}-gpu"
          extra=()
          if [ "${EXTRAS}" = "true" ]; then
            extra+=(--cuda-archive "target/dist/zam-cuda-${v}-${{ matrix.platform }}.${{ matrix.ext }}")
          fi
          cargo xtask smoke --expect-device cpu --archive "target/dist/${name}.${{ matrix.ext }}" "${extra[@]}"
          rm -rf "target/smoke/${name}"
      # Архивы уже сжаты: повторное сжатие артефакта только тратит время.
      - name: артефакты (комплекты)
        if: inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            target/dist/zam-server-*.${{ matrix.ext }}
            target/dist/zam-[0-9]*.${{ matrix.ext }}
          compression-level: 0
          if-no-files-found: error
      - name: артефакты (zam-cuda)
        if: inputs.upload && inputs.extras
        uses: actions/upload-artifact@v4
        with:
          name: dist-cuda-${{ matrix.platform }}
          path: target/dist/zam-cuda-*.${{ matrix.ext }}
          compression-level: 0
          if-no-files-found: error

  # zam-models: от платформы не зависит, release-бинарники не нужны (только xtask).
  models:
    name: models
    if: inputs.extras
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: fetch-models (комплект zam-models)
        run: cargo xtask fetch-models
      - name: package --with-models
        env:
          VERSION: ${{ inputs.version }}
        run: cargo xtask package --platform linux-x64 --version "${VERSION#v}" --with-models --no-kit
      - name: артефакты (zam-models)
        if: inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-models
          path: target/dist/zam-models-*.zip
          compression-level: 0
          if-no-files-found: error
