[workspace]
resolver = "3"
# xtask добавится в members в Task 12
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.92"

# Общие версии зависимостей; крейты подключают через `dep.workspace = true`
[workspace.dependencies]
uuid = { version = "1", features = ["v7"] }
rand = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
ipnet = { version = "2", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
anyhow = "1"
http-body-util = "0.1"
argon2 = { version = "0.5", features = ["std"] }
fs4 = { version = "1", features = ["sync"] }
jiff = { version = "0.2", features = ["serde"] }
base64 = "0.22"
subtle = "2.6"
cookie = "0.18"
memory-serve = "2.4"

# argon2 в debug без оптимизаций слишком медленный для тестов входа
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
