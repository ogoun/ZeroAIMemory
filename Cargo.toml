[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Фазз-пакет собирается только nightly-тулчейном через cargo-fuzz
exclude = ["crates/zam-markdown/fuzz"]

[workspace.package]
version = "0.0.2-m1"
edition = "2024"
license = "MIT"
rust-version = "1.92"

# Общие версии зависимостей; крейты подключают через `dep.workspace = true`
[workspace.dependencies]
uuid = { version = "1", features = ["v7"] }
rand = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
ipnet = { version = "2", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
anyhow = "1"
http-body-util = "0.1"
argon2 = { version = "0.5", features = ["std"] }
fs4 = { version = "1", features = ["sync"] }
jiff = { version = "0.2", features = ["serde"] }
base64 = "0.22"
subtle = "2.6"
cookie = "0.18"
memory-serve = "2.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
assert_cmd = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
# M1: Markdown, подсветка, санитизация, диффы, вложения, кэш рендера
# тильда: comrak::Anchorizer — #[doc(hidden)], минорный выпуск может его сдвинуть
comrak = { version = "~0.56", default-features = false }
# набор default-fancy без загрузчиков plist/yaml (yaml-rust не сопровождается): встроенные дампы и чистый Rust regex
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
ammonia = "4"
similar = "2"
mime_guess = "2"
# потоковая загрузка вложений: multipart → AsyncRead (оба уже в дереве зависимостей axum/tower-http)
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
futures-util = { version = "0.3", default-features = false }
lru = "0.18"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# хеш текста и id чанков (§6.3)
blake3 = "1"
# M2: границы предложений UAX #29 (L0, перекрытие чанков §8.2)
unicode-segmentation = "1.13"

# argon2 в debug без оптимизаций слишком медленный для тестов входа
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
