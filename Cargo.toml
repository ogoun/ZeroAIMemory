[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Фазз-пакеты собираются только nightly-тулчейном через cargo-fuzz
exclude = ["crates/zam-markdown/fuzz", "crates/zam-code/fuzz"]

[workspace.package]
version = "0.0.10-m5.7"
edition = "2024"
license = "MIT"
rust-version = "1.92"

# Общие версии зависимостей; крейты подключают через `dep.workspace = true`
[workspace.dependencies]
uuid = { version = "1", features = ["v7", "v5"] }
rand = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
ipnet = { version = "2", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
anyhow = "1"
http-body-util = "0.1"
argon2 = { version = "0.5", features = ["std"] }
fs4 = { version = "1", features = ["sync"] }
jiff = { version = "0.2", features = ["serde"] }
base64 = "0.22"
subtle = "2.6"
cookie = "0.18"
memory-serve = "2.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
assert_cmd = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
# M5: потоковый разбор XML DOCX/PPTX (zam-docs) — MIT, чистый Rust; >= 0.41 обязательно
# (RUSTSEC-2026-0194/0195); 0.42.0 выпущена 2026-08-22; без serialize и encoding (OOXML — UTF-8)
quick-xml = { version = "=0.42.0", default-features = false }
# M5: кодировки CSV (UTF-16, Windows-1251) и кодовые страницы XLS BIFF5 (zam-docs) — уже в
# графе транзитивно; (Apache-2.0 OR MIT) AND BSD-3-Clause; 0.8.42 выпущена 2026-09-24
encoding_rs = "=0.8.42"
# M5: PDF через pdfium (zam-docs, фича `pdfium`; только рабочий процесс doc-worker) — MIT OR
# Apache-2.0; 0.9.4 выпущена 2026-09-06 (исправлены два double-free обёртки); привязка к
# библиотеке — только динамическая (libloading), без `static`/`bindings`, без `image`
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
flate2 = "1"
# M5: миниатюры изображений (zam-docs, фича `images`; только рабочий процесс doc-worker) —
# MIT OR Apache-2.0, чистый Rust; 0.25.10 выпущена 2026-03-10 (последняя 0.25 на 2026-11-01).
# Только PNG, JPEG (zune-jpeg), GIF, WebP — без AVIF/HEIC (C, патенты; ТЗ §5), без rayon
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# M5: SIMD-ресайз миниатюр — MIT OR Apache-2.0, чистый Rust; 6.1.0 выпущена 2026-07-21;
# фича `image` — представление `DynamicImage` без копии, без rayon
fast_image_resize = { version = "=6.1.0", default-features = false, features = ["std", "image"] }
tar = { version = "0.4", default-features = false }
# M2: tar.xz redist-архивов NVIDIA для Linux (`zam-server cuda fetch`): чистый Rust, без C liblzma;
# та же версия, что у zip 9 (фичи lzma/xz); только декодер
lzma-rust2 = { version = "=0.22.0", default-features = false, features = ["std", "optimization", "xz"] }
# M1: Markdown, подсветка, санитизация, диффы, вложения, кэш рендера
# тильда: comrak::Anchorizer — #[doc(hidden)], минорный выпуск может его сдвинуть
comrak = { version = "~0.56", default-features = false }
# набор default-fancy без загрузчиков plist/yaml (yaml-rust не сопровождается): встроенные дампы и чистый Rust regex
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
ammonia = "4"
similar = "2"
mime_guess = "2"
# потоковая загрузка вложений: multipart → AsyncRead (оба уже в дереве зависимостей axum/tower-http)
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
futures-util = { version = "0.3", default-features = false }
lru = "0.18"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
# хеш текста и id чанков (§6.3)
blake3 = "1"
# M5: кэш извлечения вложений `blob_extract` — zstd(JSON), спецификация M5 §3; MIT, libzstd —
# BSD-3-Clause; уже в дереве (jieba-rs → include-flate). Без фич по умолчанию (legacy, словари)
zstd = { version = "0.13.3", default-features = false }
# M3: проверка триггеров инсайтов (§10.3): regex без обратных ссылок (ReDoS невозможен) —
# MIT OR Apache-2.0, уже в дереве; globset — маски file_glob, Unlicense OR MIT (берём MIT)
regex = "1"
globset = { version = "0.4", default-features = false }
# xtask eval: Snowball-стемминг ru/en для проверки «перефраз без общих слов» (не в продукте);
# MIT/BSD-3-Clause, без unsafe, зависимости serde/serde_derive — уже в дереве
rust-stemmers = "=1.2.0"
# M2: границы предложений UAX #29 (L0, перекрытие чанков §8.2)
unicode-segmentation = "1.13"
# M4, задача 7: NFKC ключа кэша выжимок (§9.4) — MIT OR Apache-2.0, уже в дереве (через caseless)
unicode-normalization = "0.1"
# M2: ONNX Runtime только load-dynamic (dylib рядом с exe), без ndarray (исследование 05 §1.3)
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-31", "cuda", "half", "tracing"] }
# без regex-фичи tokenizers не собирается; fancy-regex — чистый Rust (исследование 05 §2.2)
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
# fp16-веса sparse-головы bge-m3 (sparse_linear.pt)
half = "2"
# M2: gRPC-клиент Qdrant без download_snapshots (reqwest) и serde (исследование 05 §5.2)
qdrant-client = { version = "=1.19.0", default-features = false }
# только tonic::Code/Status для разбора ошибок qdrant-client (клиент tonic не реэкспортирует)
tonic = { version = "0.14", default-features = false }
# M2: супервизор нативного Qdrant — Job Object / группа процессов (исследование 05 §7.2)
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "kill-on-drop"] }
# M2, задача 16: прототип встроенного Qdrant Edge — только feature `edge` у zam-index, в комплекты
# не входит (ADR 0001); бета, API и формат хранилища меняются между минорными версиями
qdrant-edge = { version = "=0.8.0", default-features = false }
libc = "0.2"
# M3, задача 12: шифрование Vault (§7.6) — XChaCha20-Poly1305 (RustCrypto, Apache-2.0 OR MIT);
# без getrandom/rand_core 0.6: nonce и ключи берутся из rand::rngs::OsRng (как токены)
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# затирание ключей и расшифрованных значений в памяти (Apache-2.0 OR MIT, уже в дереве)
zeroize = { version = "1", features = ["serde"] }
# версия та же, что у process-wrap 10.0.1 (тип PROCESS_CREATION_FLAGS)
windows = "0.62"
# служба Windows (SCM) — только cfg(windows), MIT OR Apache-2.0 (задача 14 M4)
windows-service = "=0.8.1"
# M4, задача 9: MCP-сервер `/mcp` (§13.1) — официальный Rust SDK MCP, Apache-2.0; streamable
# HTTP без сессий (MCP 2026-07-28, SEP-2567) поверх axum через `nest_service`; только серверная
# часть: без макросов, клиента, OAuth и reqwest (аудит — журнал M4, задача 9)
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }

# M5.6: экстрактор карты кода (zam-code, фича `parse`; включает только клиент `zam`). Все — MIT,
# репозитории организации tree-sitter; build.rs грамматик — только `cc` (C11), без сети; аудит —
# журнал M5.6, задача 1. Рантайм 0.27.1 выпущен 2026-10-08: отмена разбора `parse_with_options`
tree-sitter = { version = "=0.27.1", default-features = false, features = ["std"] }
# итератор `QueryMatches` рантайма (MIT OR Apache-2.0, 0.1.9 — версия из графа tree-sitter 0.27.1)
streaming-iterator = "=0.1.9"
# грамматики первой очереди (спецификация M5.6 §3): Rust 0.24.2 (2026-03), TypeScript+TSX 0.23.2
# (2024-11), JavaScript+JSX 0.25.0 (2025-09), Python 0.25.0 (2025-09), Go 0.25.0 (2025-08),
# Java 0.23.5 (2024-12), C# 0.23.5 (2026-04; свой запрос тегов)
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c-sharp = "=0.23.5"

# argon2 в debug без оптимизаций слишком медленный для тестов входа
# Отладочная информация: у своих крейтов — только таблицы строк (трассировки паник с файлом и
# строкой), у зависимостей — нет. Полная debuginfo раздувала target/debug до ~300 ГБ за двое
# суток (десятки тестовых бинарников по сотне МБ на каждый хеш) и замедляла линковку.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# sha256 файла модели (model_id в zam-ml): bge-m3 — 568 МБ
[profile.dev.package.sha2]
opt-level = 3
# токенизатор (счётчик токенов чанкера и бюджета поиска) без оптимизаций в debug
# медленнее в десятки раз: ~1 мс на карточку выдачи в тестах и замерах
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.unicode-normalization-alignments]
opt-level = 3
# сжатие и распаковка архивов поставки (cargo xtask package|smoke, fetch в тестах): deflate
# и xz без оптимизаций в debug медленнее на порядок — zam-models (2,9 ГБ) паковался 13 мин
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.lzma-rust2]
opt-level = 3

# разбор tree-sitter (рантайм и C-код грамматик) без оптимизаций в debug медленнее в разы:
# тесты экстрактора (10 МБ, вложенность 100 000, proptest) и хуки `zam` в отладочной сборке
[profile.dev.package.tree-sitter]
opt-level = 3
[profile.dev.package.tree-sitter-rust]
opt-level = 3
[profile.dev.package.tree-sitter-typescript]
opt-level = 3
[profile.dev.package.tree-sitter-javascript]
opt-level = 3
[profile.dev.package.tree-sitter-python]
opt-level = 3
[profile.dev.package.tree-sitter-go]
opt-level = 3
[profile.dev.package.tree-sitter-java]
opt-level = 3
[profile.dev.package.tree-sitter-c-sharp]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
