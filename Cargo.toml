[workspace]
resolver = "3"
# xtask добавится в members в Task 12
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.92"

# Общие версии зависимостей; крейты подключают через `dep.workspace = true`
[workspace.dependencies]
uuid = { version = "1", features = ["v7"] }
rand = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
ipnet = { version = "2", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
argon2 = { version = "0.5", features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
