# Qdrant: закреплённая версия и SHA-256 архивов. Формат и правила обновления: см. xtask (cargo xtask fetch-deps).
# vcruntime140.dll для Windows здесь не загружается: при упаковке копируется из установленного VC Redist.
# Версия встраивается при сборке: zam-index/build.rs (ожидаемая версия супервизора, путь qdrant/<ver>/) и
# zam-server (манифест `zam-server qdrant fetch`); после правки нужна пересборка сервера.
# При обновлении Qdrant проверить формат (JSON `{ack_index}`) и путь `storage/collections/zam_chunks/0/wal/first-index`
# (ack_index WAL, `zam_index::supervisor::wal_ack`): по нему штатная остановка ждёт подтверждения WAL
# и считается `/index/status` → `qdrant.wal_pending_ops`; тесты — supervisor::shutdown_waits_for_flush_bounded.
name = "qdrant"
version = "1.19.2"

[platform.windows-x64]
url = "https://github.com/qdrant/qdrant/releases/download/v1.19.2/qdrant-x86_64-pc-windows-msvc.zip"
sha256 = "7d86596f16c6e85d45a50312f5e16ccb51e059b62e3d7308110cb65b4c799a4d"
extract = ["qdrant.exe"]

[platform.linux-x64]
url = "https://github.com/qdrant/qdrant/releases/download/v1.19.2/qdrant-x86_64-unknown-linux-musl.tar.gz"
sha256 = "50b253243309ed0ae50a19f678f0d0adcc4f0b567b3bd2c5c0c7e02fa8404bb6"
extract = ["qdrant"]
