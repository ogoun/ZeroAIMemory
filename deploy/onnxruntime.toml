# ONNX Runtime (CPU) — официальный пакет NuGet Microsoft.ML.OnnxRuntime (подпись автора
# Microsoft Corporation и репозитория nuget.org). Релизы github.com/microsoft/onnxruntime
# с 2026-11-17 отвечают 404; файлы побайтово равны архивам GitHub v1.31.0, проверено 2026-11-21.
# Пакет один на обе платформы (nupkg — zip): обе записи ссылаются на него, кэш по sha256 общий.
# sha256 и size — файла .nupkg (SHA-512 сверен с packageHash каталога nuget.org).
# Пути extract — от корня пакета (runtimes/<rid>/native/), корневого каталога нет.
# В пакете Linux-библиотека уже называется libonnxruntime.so (SONAME libonnxruntime.so.1),
# переименование не нужно.
name = "onnxruntime"
version = "1.31.0"

[platform.windows-x64]
url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.31.0/microsoft.ml.onnxruntime.1.31.0.nupkg"
sha256 = "7e35fdb4f5adb62f01e60798e2e5ed05108f5fbbe1cca03fbcc37903cf7c5e3b"
size = 159626085
extract = ["runtimes/win-x64/native/onnxruntime.dll"]

[platform.linux-x64]
url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.31.0/microsoft.ml.onnxruntime.1.31.0.nupkg"
sha256 = "7e35fdb4f5adb62f01e60798e2e5ed05108f5fbbe1cca03fbcc37903cf7c5e3b"
size = 159626085
extract = ["runtimes/linux-x64/native/libonnxruntime.so"]
