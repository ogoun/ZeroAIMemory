    { url = "https://huggingface.co/onnx-community/bge-reranker-v2-m3-ONNX/resolve/6f5ff65298512715a1e669753bc754d2bc8f367b/tokenizer.json", path = "tokenizer.json", size = 17082900, sha256 = "8bf8afbfd11306bd872018c53bfdf2e160a56f8edbcf49933324404791c148d3" },
