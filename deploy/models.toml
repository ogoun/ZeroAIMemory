# Модели ZeroAIMemory (§8.4, §16.3). Каждая модель закреплена ревизией (commit Hugging Face
# в пути /resolve/<ревизия>/) и sha256 каждого файла; при несовпадении загрузка падает.
#
# Поля:
#   id                    — каталог <data_dir>/models/<id>/ (в разработке: target/models/<id>/);
#   role                  — embed | rerank | test;
#   device                — cpu | gpu | any: для какого устройства предназначен вариант;
#   license               — SPDX-идентификатор лицензии весов;
#   bundle                — входит ли модель в архив zam-models;
#   requires_license_ack  — загрузка только с явным согласием (--accept-nc-license);
#                           допустимо только при bundle = false;
#   files                 — url (https), path (имя файла в каталоге модели), size (байт), sha256;
#   [model.spec]          — описатель для zam-ml: dim и pooling (cls | mean) для embed/test,
#                           sparse_head (имя файла из files), max_tokens_passage и max_tokens_query.
#                           Для реранкера запрос усекается до max_tokens_query, пара целиком —
#                           до max_tokens_passage. dynamic_quant = true — граф квантует активации
#                           динамически по всему тензору (DynamicQuantizeLinear): соседи по батчу
#                           меняют вектор (косинус ≈ 0,99), поэтому такие модели прогоняются по
#                           одному тексту. Пишется в <id>/model.toml для zam-ml.
#
# Источники и хэши: docs/research/2026-10-19-05-m2-index-ml.md (§3, §4, §9); полные sha256
# сверены с API Hugging Face (lfs.sha256, X-Linked-ETag), для файлов без LFS — посчитаны при загрузке.

# bge-m3 для CPU: динамический int8 (per-channel) от Xenova, sparse-голова из оригинала BAAI.
[[model]]
id = "bge-m3-int8"
role = "embed"
device = "cpu"
license = "MIT"
bundle = true
files = [
    { url = "https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/onnx/model_int8.onnx", path = "model.onnx", size = 568456694, sha256 = "a206e10e995aa2a833924bcd725ba5dd6c3425cd34bac3cf2b5677cd2a1c51d6" },
    { url = "https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/tokenizer.json", path = "tokenizer.json", size = 17082821, sha256 = "6710678b12670bc442b99edc952c4d996ae309a7020c1fa0096dd245c2faf790" },
    { url = "https://huggingface.co/BAAI/bge-m3/resolve/5617a9f61b028005a4858fdac845db406aefb181/sparse_linear.pt", path = "sparse_linear.pt", size = 3516, sha256 = "45c93804d2142b8f6d7ec6914ae23a1eee9c6a1d27d83d908a20d2afb3595ad9" },
]
[model.spec]
dim = 1024
pooling = "cls"
sparse_head = "sparse_linear.pt"
max_tokens_passage = 1024
max_tokens_query = 512
dynamic_quant = true

# bge-m3 для GPU: fp16 от Xenova (входы i64, выход f32), токенизатор и sparse-голова те же.
[[model]]
id = "bge-m3-fp16"
role = "embed"
device = "gpu"
license = "MIT"
bundle = true
files = [
    { url = "https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/onnx/model_fp16.onnx", path = "model.onnx", size = 1133992936, sha256 = "4f1a646a3d4f39985589e9991a717044ede8278617fe55e3d246838bc05055e9" },
    { url = "https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858/tokenizer.json", path = "tokenizer.json", size = 17082821, sha256 = "6710678b12670bc442b99edc952c4d996ae309a7020c1fa0096dd245c2faf790" },
    { url = "https://huggingface.co/BAAI/bge-m3/resolve/5617a9f61b028005a4858fdac845db406aefb181/sparse_linear.pt", path = "sparse_linear.pt", size = 3516, sha256 = "45c93804d2142b8f6d7ec6914ae23a1eee9c6a1d27d83d908a20d2afb3595ad9" },
]
[model.spec]
dim = 1024
pooling = "cls"
sparse_head = "sparse_linear.pt"
max_tokens_passage = 1024
max_tokens_query = 512

# Маленькая тестовая модель для CI и интеграционных тестов (англоязычная, вход token_type_ids).
[[model]]
id = "minilm-l6-int8"
role = "test"
device = "any"
license = "Apache-2.0"
bundle = false
files = [
    { url = "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/751bff37182d3f1213fa05d7196b954e230abad9/onnx/model_int8.onnx", path = "model.onnx", size = 22972370, sha256 = "afdb6f1a0e45b715d0bb9b11772f032c399babd23bfc31fed1c170afc848bdb1" },
    { url = "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/751bff37182d3f1213fa05d7196b954e230abad9/tokenizer.json", path = "tokenizer.json", size = 711661, sha256 = "da0e79933b9ed51798a3ae27893d3c5fa4a201126cef75586296df9b4d2c62a0" },
]
[model.spec]
dim = 384
pooling = "mean"
max_tokens_passage = 256
max_tokens_query = 128
dynamic_quant = true

