# Пример конфигурации zam-server. Значения ниже совпадают со значениями по умолчанию.
# Порядок слоёв: умолчания -> этот файл -> переменные ZAM_<РАЗДЕЛ>__<КЛЮЧ> -> аргументы командной строки.
# Пример: ZAM_SERVER__BIND=127.0.0.1:9000, ZAM_DATA_DIR=/srv/zam.

# Каталог данных (базы, индексы, блокировка). Относительный путь считается от текущего каталога.
data_dir = "./data"

[server]
# Адрес и порт, на котором сервер принимает соединения.
bind = "0.0.0.0:7700"
# Внешний адрес сервера (для ссылок и cookie); необязательно.
# public_url = "https://example.com/memory"
# Префикс пути за обратным прокси: "" или "/memory" (без завершающего "/").
base_path = ""
# Доверенные прокси (CIDR или одиночный IP): только от них принимается X-Forwarded-*.
trusted_proxies = []

[admin]
# Логин администратора WebUI.
login = "admin"
# Хэш пароля argon2id (получить: zam-server hash-password).
# Если не задан, используется переменная окружения ZAM_ADMIN_PASSWORD (хэшируется в памяти).
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."

[log]
# Уровень журнала: error, warn, info, debug, trace.
level = "info"
# Формат журнала: "json" или "text".
format = "json"
# Сколько файлов журнала хранить (ротация по дням).
max_files = 14

[qdrant]
# Режим Qdrant: "managed" (запускается сервером) или "external" (внешний, нужен url).
# "edge" (встроенный qdrant-edge) — прототип M2, в сервер не подключён (docs/adr/0001-qdrant-edge.md):
# конфиг его принимает, но векторный поиск выключается с причиной в журнале и /index/status.
mode = "managed"
# gRPC-адрес внешнего Qdrant (для mode = "external").
# url = "http://127.0.0.1:6334"
# API-ключ внешнего Qdrant (только для mode = "external"; лучше через ZAM_QDRANT__API_KEY).
# Управляемый Qdrant получает новый случайный ключ при каждом старте.
# api_key = "..."
# Порты управляемого Qdrant (слушает только 127.0.0.1).
http_port = 6333
grpc_port = 6334
# Бинарник управляемого Qdrant. По умолчанию — из комплекта: <каталог zam-server>/qdrant/<версия>/qdrant[.exe];
# если его нет, скачайте: zam-server qdrant fetch.
# binary = "/opt/zam/qdrant/1.19.2/qdrant"
# Потоки поиска и бюджет CPU оптимизатора Qdrant (0 — авто): не отбирать CPU у инференса.
max_search_threads = 2
optimizer_cpu_budget = 2

[ml]
# Устройство инференса: "auto" (CUDA, если доступна, иначе CPU), "cpu" или "cuda".
device = "auto"
# Каталог моделей. По умолчанию — <data_dir>/models; загрузка: zam-server models fetch.
# models_dir = "/srv/zam/models"
# Модель эмбеддингов. По умолчанию bge-m3-fp16 в GPU-комплекте при доступной CUDA,
# иначе bge-m3-int8. Смена модели выключает векторный поиск до reindex.
# embed_model = "bge-m3-int8"
# Библиотека ONNX Runtime. По умолчанию — рядом с zam-server (onnxruntime.dll / libonnxruntime.so).
# Без неё (или без модели) сервер работает в режиме FTS-only и сообщает об этом.
# ort_dylib = "/opt/zam/libonnxruntime.so"
# Потоки инференса: индексация (0 — авто) и запросы (зарезервированы под поиск).
index_threads = 0
query_threads = 2
# Выгрузка модели после простоя: "" — выключено, иначе <число>s|m|h (например "30m").
# На 0.0.3-m2 не реализована: значение проверяется, сервер пишет WARN и держит модель в памяти.
unload_after = ""
# Серверный реранк (поиск с "rerank": "on"; по умолчанию выключен, в хуках не используется).
# Модель выбирается по устройству эмбеддера и грузится при первом таком запросе.
# CPU: jina-reranker-v2 — лицензия CC-BY-NC-4.0 (только некоммерческое использование), в
# комплект моделей не входит: zam-server models fetch --device cpu --reranker --accept-nc-license.
# GPU: bge-reranker-v2-m3 (Apache-2.0): zam-server models fetch --device gpu --reranker.
# Для коммерческого использования на CPU задайте rerank_model_cpu = "bge-reranker-v2-m3"
# (медленнее: около 8 с на 20 кандидатов против 1,4 с у jina на 12 ядрах).
rerank_model_cpu = "jina-reranker-v2"
rerank_model_gpu = "bge-reranker-v2-m3"
# Сколько первых кандидатов слияния переранжировать и предел токенов фрагмента в паре.
rerank_top = 20
rerank_tokens = 256
# Параллельных сессий jina-reranker-v2 (динамический int8 считает пары по одной): 0 — авто
# (до 2, ядра index_threads делятся между ними). Каждая сессия — ещё ~0,3 ГБ памяти, на
# 12 ядрах: 1 — 1,9 с, 2 — 1,4 с, 4 — 1,15 с на 20 кандидатов. У bge-reranker-v2-m3 сессия
# всегда одна.
rerank_sessions = 0

[index]
# Предел токенов одного вызова инференса при индексации.
batch_tokens = 8192
# Пауза между пачками заданий, мс: индексация уступает поиску.
yield_ms = 5
# Дебаунс свёртки L0 папок, мс.
rollup_debounce_ms = 2000
# Чанкинг Markdown (§8.2), в токенах модели: лист набирается до chunk_target_min..chunk_target_max,
# недобравший может вырасти до chunk_hard_max (предел любого листа: не больше окна модели минус
# 64 токена на префикс — у bge-m3 960, больше — уменьшается с WARN); секция
# короче chunk_merge_below склеивается с соседней; chunk_overlap_sentences — предложений
# перекрытия соседних листов секции (0..5). Значения подобраны на eval (eval/README.md).
# Новые пороги действуют на заметки, записанные после перезапуска; чтобы перенарезать уже
# записанные, выполните zam-server reindex --full (или POST /api/v1/admin/reindex с full).
chunk_target_min = 300
chunk_target_max = 500
chunk_hard_max = 800
chunk_merge_below = 100
chunk_overlap_sentences = 1

[search]
# Слияние каналов поиска weighted RRF: балл = Σ вес / (rrf_k + место в канале).
rrf_k = 60.0
# Веса каналов: векторный (Qdrant: dense + sparse + сводки), FTS5 bm25 и FTS5 trigram
# (идентификаторы и код). Без моделей или Qdrant векторный канал выключен (degraded).
w_vector = 1.0
w_fts = 1.0
# Вес bm25, когда ни один чанк не содержит всех слов запроса и сработал ослабленный запрос
# (любое слово). Подобран на eval (eval/README.md): при весе 1.0 такие случайные совпадения
# по одному слову вытесняли векторные находки перефразов. Действует только при работающем
# векторном канале и только на заметки, которые он видит: FTS-only, Human и заметки в очереди
# индексации ищутся с w_fts. Оценка подобрана на том же наборе eval (in-sample, завышена).
w_fts_relaxed = 0.25
w_trigram = 0.7
# Полупериод затухания по свежести, дней (0 — без затухания). Старая заметка теряет
# не больше половины балла.
recency_half_life_days = 180.0
# Не больше чанков с одного узла в выдаче.
max_per_node = 3
# Бусты — множители слитого балла (§9.2 п. 4): insight вида gotcha и failure, узлы и записи
# текущей области (заголовок X-Zam-Area). 1.0 — без буста. Значения подлежат проверке сеткой eval.
boost_gotcha = 1.15
boost_failure = 1.15
boost_area = 1.10

[insights]
# Дедупликация при записи insight (§7.5): действующий insight той же области с dense-косинусом
# не ниже порога (или с тем же нормализованным заголовком) — кандидат в дубли (409).
dedup_threshold = 0.90

[limits]
# Предел размера заметки, байт (5 МБ). Больше — 413 при создании, замене и PATCH.
note_max_bytes = 5242880
# Предел размера вложения, байт (200 МБ).
blob_max_bytes = 209715200
