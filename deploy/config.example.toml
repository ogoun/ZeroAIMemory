# Пример конфигурации zam-server. Значения ниже совпадают со значениями по умолчанию.
# Порядок слоёв: умолчания -> этот файл -> переменные ZAM_<РАЗДЕЛ>__<КЛЮЧ> -> аргументы командной строки.
# Пример: ZAM_SERVER__BIND=127.0.0.1:9000, ZAM_DATA_DIR=/srv/zam.

# Каталог данных (базы, индексы, блокировка). Относительный путь считается от текущего каталога.
data_dir = "./data"

[server]
# Адрес и порт, на котором сервер принимает соединения.
bind = "0.0.0.0:7700"
# Внешний адрес сервера (для ссылок и cookie); необязательно.
# public_url = "https://example.com/memory"
# Префикс пути за обратным прокси: "" или "/memory" (без завершающего "/").
base_path = ""
# Доверенные прокси (CIDR или одиночный IP): только от них принимается X-Forwarded-*.
trusted_proxies = []
# Каталог клиентов zam для GET /downloads/zam/{windows-x64|linux-x64}: zam[.exe] своей ОС и
# downloads/<платформа>/zam[.exe] другой; по умолчанию — каталог исполняемого файла zam-server.
# downloads_dir = "/opt/zam-server"

[admin]
# Логин администратора WebUI.
login = "admin"
# Хэш пароля argon2id (получить: zam-server hash-password).
# Если не задан, используется переменная окружения ZAM_ADMIN_PASSWORD (хэшируется в памяти).
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."

[log]
# Уровень журнала: error, warn, info, debug, trace.
level = "info"
# Формат журнала: "json" или "text".
format = "json"
# Сколько файлов журнала хранить (ротация по дням).
max_files = 14

[qdrant]
# Режим Qdrant: "managed" (запускается сервером) или "external" (внешний, нужен url).
# "edge" (встроенный qdrant-edge) — прототип M2, в сервер не подключён (docs/adr/0001-qdrant-edge.md):
# конфиг его принимает, но векторный поиск выключается с причиной в журнале и /index/status.
mode = "managed"
# gRPC-адрес внешнего Qdrant (для mode = "external").
# url = "http://127.0.0.1:6334"
# API-ключ внешнего Qdrant (только для mode = "external"; лучше через ZAM_QDRANT__API_KEY).
# Управляемый Qdrant получает новый случайный ключ при каждом старте.
# api_key = "..."
# Порты управляемого Qdrant (слушает только 127.0.0.1).
http_port = 6333
grpc_port = 6334
# Бинарник управляемого Qdrant. По умолчанию — из комплекта: <каталог zam-server>/qdrant/<версия>/qdrant[.exe];
# если его нет, скачайте: zam-server qdrant fetch.
# binary = "/opt/zam/qdrant/1.19.2/qdrant"
# Потоки поиска и бюджет CPU оптимизатора Qdrant (0 — авто): не отбирать CPU у инференса.
max_search_threads = 2
optimizer_cpu_budget = 2
# Сброс и WAL коллекции managed Qdrant (задача 19 M3, eval/results/2026-10-25-bench-first-start.md).
# Как часто Qdrant сбрасывает сегменты на диск и подтверждает WAL, с (1..=60). Меньше — короче повтор WAL
# после жёсткой остановки, но медленнее индексация на HDD (1 с — −11…−17 %, 2 с — около −18 %, 3 с — около −3 %).
# Умолчание 3 с (с 0.0.5-m4, было 5 с): подтверждение WAL после пачки приходит за 4,4–8,7 с вместо 7,4–10,0 с.
flush_interval_sec = 3
# Размер блока WAL новой коллекции, МБ (1..=1024); на время старта не влияет. У существующей коллекции
# меняется только пересозданием: zam-server qdrant reset.
wal_capacity_mb = 32
# Штатная остановка сразу после записи ждёт, пока Qdrant подтвердит её в WAL, не дольше стольких мс
# (0 — не ждать; 0..=60000): тогда следующий старт не повторяет WAL (на HDD 2,1–2,5 с вместо 5–8 с, GPU и CPU).
# Ожидание кончается с подтверждением (на HDD при flush_interval_sec = 3 — 4,4–8,7 с после пачки
# записей); умолчание 14000 (с 0.0.5-m4, было 10000) — на 40 % больше прежнего предела.
# Стоп-таймаут менеджера служб — max(90, ceil(shutdown_flush_wait_ms / 1000) + 80) с: при 14000 — 94 с
# (TimeoutStopSec=94 в systemd, AppStopMethodConsole 94000 в NSSM); при 60000 (максимум) — 140 с.
shutdown_flush_wait_ms = 14000
# Точный поиск без HNSW и квантования (полный перебор точек) — только для прогонов гейта качества
# eval (cargo xtask eval --quality-gate, с 0.0.5-m4); в работе не включать. Действует в режимах
# managed и external (параметр запроса), в edge — нет; при включении сервер пишет WARN на старте.
# exact_search = false

[ml]
# Устройство инференса: "auto" (CUDA, если доступна, иначе CPU), "cpu" или "cuda".
device = "auto"
# Каталог моделей. По умолчанию — <data_dir>/models; загрузка: zam-server models fetch.
# models_dir = "/srv/zam/models"
# Модель эмбеддингов. По умолчанию bge-m3-fp16 в GPU-комплекте при доступной CUDA,
# иначе bge-m3-int8. Смена модели выключает векторный поиск до reindex.
# embed_model = "bge-m3-int8"
# Библиотека ONNX Runtime. По умолчанию — рядом с zam-server (onnxruntime.dll / libonnxruntime.so).
# Без неё (или без модели) сервер работает в режиме FTS-only и сообщает об этом.
# ort_dylib = "/opt/zam/libonnxruntime.so"
# Потоки инференса: индексация (0 — авто) и запросы (зарезервированы под поиск).
index_threads = 0
query_threads = 2
# Выгрузка модели после простоя: "" — выключено, иначе <число>s|m|h (например "30m").
# На 0.0.10-m5.7 не реализована: значение проверяется, сервер пишет WARN и держит модель в памяти.
unload_after = ""
# Серверный реранк (поиск с "rerank": "on"; по умолчанию выключен, в хуках не используется).
# Модель выбирается по устройству эмбеддера и грузится при первом таком запросе.
# CPU: jina-reranker-v2 — лицензия CC-BY-NC-4.0 (только некоммерческое использование), в
# комплект моделей не входит: zam-server models fetch --device cpu --reranker --accept-nc-license.
# GPU: bge-reranker-v2-m3 (Apache-2.0): zam-server models fetch --device gpu --reranker.
# Для коммерческого использования на CPU задайте rerank_model_cpu = "bge-reranker-v2-m3"
# (медленнее: около 8 с на 20 кандидатов против 1,4 с у jina на 12 ядрах).
rerank_model_cpu = "jina-reranker-v2"
rerank_model_gpu = "bge-reranker-v2-m3"
# Сколько первых кандидатов слияния переранжировать и предел токенов фрагмента в паре.
rerank_top = 20
rerank_tokens = 256
# Параллельных сессий jina-reranker-v2 (динамический int8 считает пары по одной): 0 — авто
# (до 2, ядра index_threads делятся между ними). Каждая сессия — ещё ~0,3 ГБ памяти, на
# 12 ядрах: 1 — 1,9 с, 2 — 1,4 с, 4 — 1,15 с на 20 кандидатов. У bge-reranker-v2-m3 сессия
# всегда одна.
rerank_sessions = 0

[index]
# Предел токенов одного вызова инференса при индексации.
batch_tokens = 8192
# Пауза между пачками заданий, мс: индексация уступает поиску.
yield_ms = 5
# Дебаунс свёртки L0 папок, мс.
rollup_debounce_ms = 2000
# Чанкинг Markdown (§8.2), в токенах модели: лист набирается до chunk_target_min..chunk_target_max,
# недобравший может вырасти до chunk_hard_max (предел любого листа: не больше окна модели минус
# 64 токена на префикс — у bge-m3 960, больше — уменьшается с WARN); секция
# короче chunk_merge_below склеивается с соседней; chunk_overlap_sentences — предложений
# перекрытия соседних листов секции (0..5). Значения подобраны на eval (eval/README.md).
# Лист никогда не кончается заголовком H4–H6 и вводной фразой на «:» — они уходят в лист
# со своим содержимым; H4–H6 входят в путь заголовков листа (chunk_heading_path_h4).
# chunk_boundary_lambda — вес силы границы при выборе разреза (0 — жадная упаковка, умолчание с
# 0.0.5-m4, было 0.5; больше 0 — разрез на сильных границах: перед H4–H6 и ---, между блоками,
# затем между предложениями);
# chunk_cohesion — учитывать в силе границы смену лексики в длинной прозе (только при λ > 0:
# при chunk_boundary_lambda = 0 флаг ничего не меняет, при старте — предупреждение в журнале);
# chunk_prefix_l0 — эксперимент: L0 заметки (до 50 токенов) в контекстном префиксе листов.
# Смена этих настроек или порогов: база перенарезается разово в фоне при первом открытии после
# перезапуска (векторы пересчитываются только у изменившихся листов, остальные — из кэша); о ней
# сообщают строка WARN «перенарезка базы <user>: изменились <ключи> — <N> записей», поле rechunk
# в GET /api/v1/index/status и баннер на странице «Индекс» WebUI.
# В отпечатке нарезки — пороги после ужатия под окно модели, поэтому смена модели с другим
# окном или chunk_prefix_l0 тоже запускает такую перенарезку.
chunk_target_min = 300
chunk_target_max = 500
chunk_hard_max = 800
chunk_merge_below = 100
chunk_overlap_sentences = 1
chunk_boundary_lambda = 0.0
chunk_cohesion = false
chunk_prefix_l0 = false
chunk_heading_path_h4 = true

[search]
# Слияние каналов поиска weighted RRF: балл = Σ вес / (rrf_k + место в канале).
rrf_k = 60.0
# Веса каналов: векторный (Qdrant: dense + sparse + сводки), FTS5 bm25 и FTS5 trigram
# (идентификаторы и код). Без моделей или Qdrant векторный канал выключен (degraded).
w_vector = 1.0
w_fts = 1.0
# Вес bm25, когда ни один чанк не содержит всех слов запроса и сработал ослабленный запрос
# (любое слово). Подобран на eval (eval/README.md): при весе 1.0 такие случайные совпадения
# по одному слову вытесняли векторные находки перефразов. Действует только при работающем
# векторном канале и только на заметки, которые он видит: FTS-only, Human и заметки в очереди
# индексации ищутся с w_fts. Оценка подобрана на том же наборе eval (in-sample, завышена).
w_fts_relaxed = 0.25
# Вес канала alias (M4.5): тот же FTS по запросу, где слово, совпавшее с именем или псевдонимом
# термина словаря, заменено группой «слово OR имя OR псевдонимы». Находит «выжимка» по запросу
# «summary». 0..=1 (ниже исходного канала), 0 — канал выключен.
w_fts_alias = 0.5
w_trigram = 0.7
# Полупериод затухания по свежести, дней (0 — без затухания). Старая заметка теряет
# не больше половины балла.
recency_half_life_days = 180.0
# Не больше чанков с одного узла в выдаче.
max_per_node = 3
# Не больше фрагментов с одного документа-вложения в выдаче (M5); квота заметки-владельца — своя.
max_per_attachment = 2
# Окно prefetch фрагментов вложений гибридного поиска (M5): свой prefetch, чтобы длинный документ
# не вытеснял листы заметок; 1..=500, вдвое при area/certainty.
attach_prefetch = 30
# Бусты — множители слитого балла (§9.2 п. 4): insight вида gotcha и failure, узлы и записи
# текущей области (заголовок X-Zam-Area). 1.0 — без буста. Буст вида — ниже буста theorem
# (eval/grid-m3.toml, eval/grid-m3-kind.toml): с 1.15 и 1.10 гипотеза вида gotcha обходила
# противоречащую ей theorem. Балл выше 1 после бустов приводится к шкале делением всех баллов
# выдачи на лучший.
boost_gotcha = 1.05
boost_failure = 1.05
boost_area = 1.10
# Эпистемический статус certainty заметок и записей (§7.5): axiom > theorem > hypothesis
# (подтверждено сеткой eval: слабее — ниже reliable_first и nDCG@10).
boost_axiom = 1.20
boost_theorem = 1.10
boost_hypothesis = 1.00
# expand=graph (§8.5): соседи найденных элементов по графу получают балл родителя × вес (0..=1).
graph_weight = 0.5
# Канал папок (§8.3): найденная папка поднимает чанки своего поддерева на w_folder / (rrf_k + ранг).
# 0 — канал выключен: по сетке eval 0.3–1.0 хуже (заметки обходят записи журналов, у них нет папки).
w_folder = 0.0
# Не больше карточек папок в выдаче при filters.kinds ∋ folder.
max_folders = 2
# Порядок по связи contradicts (M4.5): после реранка и бустов запись не стоит выше действующей
# более надёжной записи (theorem/axiom), которой противоречит, если обе в выдаче (цель — сразу
# перед записью; axiom → axiom и theorem → theorem не переставляются).
# false — порядок реранкера без поправки.
contradicts_order = true
# Бюджет выдачи POST /search и memory_search без явного budget_tokens, токенов счётчика сервера
# (1..=200000; M6 §4.2): Markdown brief/notes целиком, со строкой MCP «~N tok», укладывается в
# него; первая карточка отдаётся всегда (фрагмент урезается).
budget_tokens = 800
# Отсечка слабых карточек brief/notes (0..=1; M6 §4.2): карточка с баллом ниже brief_min_rel ×
# лучший не выдаётся, явный top_k её не снимает; 0 — выключено (поведение v0.0.9; сетка ТС-1
# задачи 5 M6: 0,5 выбрасывает находки только по псевдонимам словаря — их балл вдвое ниже).
brief_min_rel = 0.0

[insights]
# Дедупликация при записи insight (§7.5): действующий insight той же области с dense-косинусом
# не ниже порога (или с тем же нормализованным заголовком) — кандидат в дубли (409).
dedup_threshold = 0.90
# Близкие аксиомы (M4.5): при записи агентом решения (insight decision) действующие аксиомы-решения
# той же области с dense-косинусом не ниже порога (до 3) попадают в warnings: decision_near_axiom.
# Запись не отклоняется. 0..=1.
decision_conflict_threshold = 0.80

[read]
# Чтение пачкой POST /read (§9.3 шаг 2): не больше элементов в запросе (больше — 422).
max_items = 20
# Бюджет токенов на весь ответ по умолчанию; не влезший элемент обрезается, следующие — (budget).
budget_tokens = 1500

[cache]
# Кэш выжимок агентов (§9.4): предел выжимки в токенах (больше — 413).
summary_tokens = 600
# Порог косинуса семантического попадания запроса в кэш.
semantic_threshold = 0.92
# Порог косинуса нового релевантного источника: выжимка становится stale: new_sources.
new_sources_threshold = 0.80
# Срок жизни выжимки без обращений, дней; предел выжимок на базу (LRU). Превращённые в записи не удаляются.
ttl_days = 30
max_entries = 2000
# Поиск выдаёт выжимки других сессий той же области (с автором, машиной и датой).
cross_session = true

[recall]
# Проактивное вспоминание POST /recall (§10.3): бюджет дайджеста старта сессии (и подсказок по
# умолчанию), токенов.
digest_tokens = 1500
# Бюджет пакета восстановления после сжатия контекста и resume (M4.5 §9.2), токенов: задачи,
# ответы человека, решения за 7 дней, затем обычный дайджест в остатке.
recovery_tokens = 2000
# Бюджет пакета под задачу (M4.5 §9.4), токенов: POST /recall {event: "brief", task} — хук
# subagent-start и MCP memory_recall: правила L0, решения axiom/theorem, термины, ловушки, файлы.
brief_tokens = 800
# Наименьший балл поиска подсказки к запросу пользователя (0..1); ниже — тишина.
prompt_min_score = 0.6
# Бюджет сервера на сбор подсказок, мс: по превышении — собранное и warnings: ["recall timeout"].
timeout_ms = 200
# Фрагмент под подсказкой поиска к запросу (правило, insight), токенов (0..=200; M6 §4.3);
# 0 — без фрагмента.
snippet_tokens = 60

[limits]
# Предел размера заметки, байт (5 МБ). Больше — 413 при создании, замене и PATCH.
note_max_bytes = 5242880
# Предел размера вложения, байт (200 МБ).
blob_max_bytes = 209715200

[vault]
# Файл мастер-ключа Vault (base64 32 байт). По умолчанию <data_dir>/master.key: создаётся при первом
# запуске (на Linux с правами 0600, на Windows — DACL только владельцу, SYSTEM и администраторам).
# ZAM_MASTER_KEY (base64 32 байт) важнее файла. Резервируйте ключ отдельно от бэкапа каталога данных:
# без него секреты не восстановить. Ключ не подходит или файла нет при существующих ключах — Vault
# заблокирован (503 vault-locked), остальной сервер работает, новый ключ не создаётся.
# Бэкап каталога данных вместе с master.key раскрывает Vault: держите ключ вне data_dir (этот путь
# или ZAM_MASTER_KEY) либо исключайте master.key из бэкапа.
# master_key_file = "/srv/zam/secrets/master.key"

[docs]
# Разбор вложений (M5). Библиотека pdfium: по умолчанию рядом с zam-server (pdfium.dll /
# libpdfium.so; относительный путь — от каталога zam-server). Без неё PDF не индексируются
# (причина — в /index/status), остальные форматы работают.
# pdfium_dylib = "/opt/zam/libpdfium.so"
# Все виды документов разбираются в рабочих процессах `zam-server doc-worker` (тот же
# бинарник), одновременно — не больше workers файлов: их число,
# заданий на процесс до перезапуска, лимит памяти процесса (МиБ; Windows — Job Object,
# Linux — RLIMIT_AS) и срок разбора файла (мс; по истечении процесс убивается, вложение —
# failed с причиной parse_timeout; падение — parse_crash, нехватка памяти — parse_oom).
# worker_memory_mb должен быть не меньше 3 × max_bytes + 64 МиБ (кадр, файл и pdfium).
workers = 2
worker_jobs = 200
worker_memory_mb = 2048
timeout_ms = 60000
# Превью вложений (/api/v1/previews/{sha256}: лист, миниатюра, текст) — свой пул рабочих
# процессов с теми же лимитами памяти и сроком (долгий разбор индексации не задерживает
# просмотр) и кэш в <data_dir>/previews, МиБ: сверх предела старые файлы вытесняются.
#
# Худший объём памяти всех рабочих процессов: (workers + preview_workers) × worker_memory_mb —
# при умолчаниях (2 + 1) × 2048 МиБ = 6 ГиБ (каждый процесс упирается в свой лимит; обычно —
# десятки МиБ). Сервер сверх того держит на каждый слот разбора (workers + preview_workers)
# кадр запроса (4/3 × max_bytes, файл в base64), кадр ответа (до 6 × max_chars + 64 МиБ) и его
# разбор (текст до 4 байт на символ и единицы) — до ≈ 420 МиБ на слот при умолчаниях
# (≈ 1,33 × max_bytes + 11,5 × max_chars + 64 МиБ), до ≈ 1,2 ГиБ при трёх слотах; обычно —
# единицы МиБ.
preview_workers = 1
preview_cache_mb = 1024
# Лимиты разбора всех форматов. Размер файла больше max_bytes — отказ; остальные дают частичный
# результат с предупреждением "truncated: <лимит>".
max_bytes = 104857600        # 100 МиБ
max_unpacked = 524288000     # распаковано из zip, 500 МиБ
max_ratio = 100              # степень сжатия записи zip (записи больше 1 МиБ)
max_entries = 10000          # записей zip
max_xml_depth = 256
max_cells = 2000000          # непустых ячеек листа
max_chars = 20000000         # объём выдачи: текст, пути заголовков и 64 символа на единицу
max_pages = 5000             # страниц PDF

[reports]
# Отчёты (M5.5): журнал решения «Отчёты», пишет агент (zam report — multipart, MCP memory_log
# kind=report — файлы в base64). Файлы отчёта — картинки и прочие файлы по относительным ссылкам
# тела; размер одного файла — limits.blob_max_bytes. Файлов в отчёте не больше max_files
# (1..1024; больше — 422), сумма их размеров — не больше max_total_bytes (больше — 413).
max_files = 64
max_total_bytes = 209715200  # 200 МиБ
# Предел отчёта через MCP: тело и декодированные файлы, байт (16 МиБ; не больше max_total_bytes).
# Больше — 413 с подсказкой отправить отчёт через zam report.
mcp_max_bytes = 16777216

[code]
# Карта кода решения (M5.6): клиент zam разбирает рабочую копию и присылает только метаданные
# символов (имена, сигнатуры ≤ 160 символов — секреты в них сервер маскирует, ссылки по именам);
# тела файлов на сервер не уходят. Карта хранится в базе владельца решения. enabled = false —
# маршруты /api/v1/code/* отвечают 404, строка дайджеста и раздел «### Код» не выводятся.
enabled = true
# Пределы недоверенного входа: файлов в манифесте POST /code/sync (1..500000), символов и
# ссылок в одном файле PUT /code/files — больше 422 с пределом в detail; тело запроса /code/*
# (1 КиБ..256 МиБ) — больше 413. Файлов в одной загрузке — не больше 500.
max_files = 50000
max_symbols_per_file = 5000
max_refs_per_file = 20000
max_request_bytes = 8388608  # 8 МиБ
# Бюджет карты GET /code/map по умолчанию (1..20000 токенов) и раздела «### Код» пакета
# субагенту /recall(brief) (0..1000; 0 — раздела нет).
map_tokens = 1000
brief_tokens = 150
# Ранги (PageRank) пересчитываются при первом запросе карты после загрузки; дольше
# rank_timeout_ms (0..60000; 0 — не ждать вовсе) запрос не ждёт — старые ранги и
# warnings: ["rank pending"], пересчёт завершится в фоне.
rank_timeout_ms = 1000

[ideas]
# Журнал «Идеи» (M5.7): замыслы человека, которые агент предлагает начать вопросом «начать /
# отложить / отказаться». proactive = false — ни раздела «### Идеи» в дайджесте, ни подсказок
# идей у всех пользователей; у пользователя есть свой выключатель ideas.proactive (WebUI
# «Подсказки хуков»), действует server && user.
proactive = true
# Идей в разделе «### Идеи» на первом session_start сессии (0..10; 0 — раздела нет) и в
# подсказке к запросу пользователя (0..3).
digest_max = 3
prompt_max = 1
# top_k отдельного поиска идей к запросу пользователя (1..20).
prompt_top_k = 5
# «Отложить» без даты — horizon через столько дней (1..3650).
defer_days = 30
