# Библиотеки NVIDIA для CUDA EP ONNX Runtime 1.31 (сборка gpu_cuda13: CUDA 13.0+, cuDNN 9.x).
# В GPU-комплект zam-server не входят (решение владельца): их ставит `zam-server cuda fetch`
# в <exe_dir>/cuda/ или архив zam-cuda-<ver>-<os>-x64. `cargo xtask fetch-deps` их не скачивает.
#
# Источники: redist-архивы NVIDIA; url, size и sha256 — из манифестов
#   https://developer.download.nvidia.com/compute/cuda/redist/redistrib_13.4.3.json
#   https://developer.download.nvidia.com/compute/cudnn/redist/redistrib_9.27.0.json (вариант cuda13).
# Минимальный набор — `ort::ep::cuda::{CUDA_DYLIBS, CUDNN_DYLIBS}` (ort 2.0.0-rc.14); тест
# xtask `real_cuda_manifest_covers_ort_dylibs` проверяет, что он покрыт.
#
# extract — пути внутри архива; файл кладётся в <exe_dir>/cuda/ под последним компонентом пути.
# Windows: архивы zip, DLL лежат в <корень>/bin/x64/ (проверено по центральному каталогу zip).
# Linux: архивы tar.xz, библиотеки в <корень>/lib/; имена с SONAME (libcudart.so.13) — это
# символические ссылки на файл с полной версией (libcudart.so.13.4.92) в том же каталоге
# (проверено на cuda_cudart). Извлекатель разрешает ссылку только на обычный файл того же
# каталога архива и кладёт его под именем SONAME.
#
# Проверено по таблицам импорта ORT 1.31 gpu_cuda13: onnxruntime_providers_cuda.dll импортирует
# cublas64_13 и cublasLt64_13, остальное грузит динамически; libonnxruntime_providers_cuda.so —
# NEEDED libcublasLt.so.13, libcublas.so.13, libcurand.so.10, libcudart.so.13 (+ libcuda.so.1
# драйвера). На Windows NVRTC и cuRAND не нужны: ort их не предзагружает, в импортах их нет,
# cudnn_engines_runtime_compiled64_9.dll ссылается только на cudnn_graph64_9.dll.
#
# Совместимость: CUDA 13.x работает на драйвере ветки R580+ (minor version compatibility).
cuda = "13.4.3"
cudnn = "9.27.0"

