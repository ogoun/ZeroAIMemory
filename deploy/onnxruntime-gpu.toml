# ONNX Runtime с CUDA EP (CUDA 13.0+, cuDNN 9.x) для GPU-комплекта — официальные пакеты NuGet
# Microsoft.ML.OnnxRuntime.Gpu.Windows и Microsoft.ML.OnnxRuntime.Gpu.Linux (подпись Microsoft
# Corporation и nuget.org). С 1.27 GPU-пакеты NuGet и PyPI по умолчанию собраны под CUDA 13.0
# (импорты: cublas64_13/cublasLt64_13; NEEDED libcudart.so.13, libcublas(Lt).so.13,
# libcurand.so.10); файлы побайтово равны архивам GitHub v1.31.0 (gpu_cuda13), проверено
# 2026-11-21.
# Библиотеки NVIDIA сюда не входят: их ставит `zam-server cuda fetch` по deploy/cuda.toml
# или архив zam-cuda-<ver>-<os>-x64. sha256 и size — файла .nupkg (SHA-512 сверен с
# packageHash каталога nuget.org). Пути extract — от корня пакета; tensorrt-провайдер не берём.
name = "onnxruntime-gpu"
version = "1.31.0"

[platform.windows-x64]
url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.gpu.windows/1.31.0/microsoft.ml.onnxruntime.gpu.windows.1.31.0.nupkg"
sha256 = "6ef71832859a6fa1cdbd51d36be301641b6de609c72a2ab206b32f6cc209959d"
size = 160447640
extract = [
    "runtimes/win-x64/native/onnxruntime.dll",
    "runtimes/win-x64/native/onnxruntime_providers_cuda.dll",
    "runtimes/win-x64/native/onnxruntime_providers_shared.dll",
]

[platform.linux-x64]
url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.gpu.linux/1.31.0/microsoft.ml.onnxruntime.gpu.linux.1.31.0.nupkg"
sha256 = "7cd256a2b6a0713a55bbb7f60b175ff004d462d56a07572a15a2ed07456514d7"
size = 244928869
extract = [
    "runtimes/linux-x64/native/libonnxruntime.so",
    "runtimes/linux-x64/native/libonnxruntime_providers_cuda.so",
    "runtimes/linux-x64/native/libonnxruntime_providers_shared.so",
]
